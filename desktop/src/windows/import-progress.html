<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'">
<title>导入历史对话</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  .panel {
    margin: 12px;
    height: calc(100% - 24px);
    background: linear-gradient(140deg, #1f2937 0%, #111827 100%);
    border: 1px solid rgba(99, 102, 241, 0.4);
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.06);
    color: #e5e7eb;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    overflow: hidden;
  }
  .panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, #6366f1, #8b5cf6, #ec4899);
    opacity: 0.85;
  }
  .header {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 600;
    color: #f3f4f6;
  }
  .header .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #818cf8;
    box-shadow: 0 0 12px rgba(129, 140, 248, 0.7);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.85); }
  }
  .subtitle {
    font-size: 11px;
    color: #9ca3af;
    line-height: 1.5;
  }
  .progress-wrap {
    margin-top: 4px;
    height: 6px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #6366f1, #8b5cf6);
    border-radius: 999px;
    transition: width 0.4s ease;
    position: relative;
  }
  .progress-bar::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(90deg,
      transparent 0%, rgba(255, 255, 255, 0.25) 50%, transparent 100%);
    animation: shimmer 1.6s linear infinite;
  }
  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  .meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: #d1d5db;
  }
  .meta .pct { color: #a5b4fc; font-variant-numeric: tabular-nums; font-weight: 600; }
  .meta .nums { color: #9ca3af; font-variant-numeric: tabular-nums; }
  .footnote {
    font-size: 10px;
    color: #6b7280;
    margin-top: 2px;
  }
  body.done .progress-bar {
    background: linear-gradient(90deg, #10b981, #34d399);
  }
  body.done .progress-bar::after { display: none; }
  body.done .header .dot {
    background: #34d399;
    box-shadow: 0 0 12px rgba(52, 211, 153, 0.7);
    animation: none;
  }
  body.failed .progress-bar {
    background: linear-gradient(90deg, #ef4444, #f87171);
  }
  body.failed .progress-bar::after { display: none; }
  body.failed .header .dot {
    background: #f87171;
    box-shadow: 0 0 12px rgba(248, 113, 113, 0.7);
    animation: none;
  }
</style>
</head>
<body>
<div class="panel">
  <div class="header"><span class="dot"></span><span id="title">正在导入历史对话</span></div>
  <div class="subtitle" id="subtitle">把 Claude / Cursor / CodeBuddy 的历史 transcript 转成 AgentMemory 记忆…</div>
  <div class="progress-wrap"><div class="progress-bar" id="bar"></div></div>
  <div class="meta">
    <span class="pct" id="pct">0%</span>
    <span class="nums" id="nums">--/--</span>
  </div>
  <div class="footnote" id="footnote">关闭此窗口不会停止任务，后台仍会跑完</div>
</div>
<script>
  const { ipcRenderer } = require('electron');
  const $title = document.getElementById('title');
  const $subtitle = document.getElementById('subtitle');
  const $bar = document.getElementById('bar');
  const $pct = document.getElementById('pct');
  const $nums = document.getElementById('nums');
  const $footnote = document.getElementById('footnote');

  function adapterLabel(id) {
    if (id === 'claude') return 'Claude';
    if (id === 'cursor-agent') return 'Cursor';
    if (id === 'codebuddy-ide') return 'CodeBuddy';
    return id || '';
  }

  ipcRenderer.on('import-progress:update', (_e, snap) => {
    if (!snap) return;
    const total = Number(snap.totalTurns ?? snap.totalSessions ?? 0);
    const done = Number(snap.processedTurns ?? snap.processedSessions ?? 0);
    const pct = total > 0 ? Math.min(100, Math.floor((done / total) * 100)) : 0;
    $bar.style.width = pct + '%';
    $pct.textContent = pct + '%';
    $nums.textContent = `${done.toLocaleString()} / ${total.toLocaleString()}`;

    if (snap.phase === 'discovering') {
      $title.textContent = '正在扫描历史对话';
      $subtitle.textContent = '正在统计可导入的会话数（不调用 AI）…';
      return;
    }

    $title.textContent = '正在导入历史对话';
    const cur = adapterLabel(snap.currentAdapterId);
    const eta = snap.etaSec != null ? `，预计还需 ${snap.etaSec}s` : '';
    // Cleaner subtitle: only AI-relevant numbers in line 1. The pre-filter
    // dropped pile (often thousands when hook had been running) goes into
    // a smaller footnote so the user doesn't see a scary "跳过 2030" next
    // to "成功 50". The N/M progress fraction (top-right) already tracks
    // only AI work, so the totals here align with what users expect.
    const failedN = Number(snap.failedTurns ?? snap.failedSessions ?? 0);
    const importedN = Number(snap.importedSummaries ?? 0);
    const failedTxt = failedN > 0 ? ` · 失败 ${failedN}` : '';
    $subtitle.textContent = cur
      ? `正在处理 ${cur}：成功 ${importedN}${failedTxt}${eta}`
      : `成功 ${importedN}${failedTxt}${eta}`;

    // Footnote: show pre-filter drops as informational. Falls back to the
    // generic "after-task" hint when there are none.
    const preFiltered = Number(snap.preFilteredTurns ?? 0);
    if (preFiltered > 0) {
      $footnote.textContent =
        `已跳过 ${preFiltered.toLocaleString()} 条（hook 已捕获或之前已导入），` +
        `不计入此次 AI 调用。关闭此窗口不会停止任务。`;
    } else {
      $footnote.textContent = '关闭此窗口不会停止任务，后台仍会跑完';
    }
  });

  ipcRenderer.on('import-progress:done', (_e, snap) => {
    const failed = snap?.phase === 'failed';
    document.body.classList.add(failed ? 'failed' : 'done');
    if (failed) {
      $title.textContent = '导入失败';
      $subtitle.textContent = snap?.errorMessage || '请查看 Worker 日志了解原因';
    } else {
      $title.textContent = '历史对话导入完成';
      const imported = Number(snap?.importedSummaries ?? 0);
      const failedN = Number(snap?.failedTurns ?? snap?.failedSessions ?? 0);
      const tail = failedN > 0
        ? `（${failedN} 条因网络抖动失败,后台稍后会自动重试）`
        : '';
      $subtitle.textContent = `已导入 ${imported.toLocaleString()} 条记忆${tail}，2 秒后自动关闭`;
      $bar.style.width = '100%';
      $pct.textContent = '100%';
    }
    $footnote.textContent = '建议接下来重建一次向量索引，让搜索吃到新数据';
  });
</script>
</body>
</html>
