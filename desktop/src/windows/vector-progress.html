<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'">
<title>向量索引重建</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  .panel {
    margin: 12px;
    height: calc(100% - 24px);
    background: linear-gradient(140deg, #1f2937 0%, #111827 100%);
    border: 1px solid rgba(99, 102, 241, 0.4);
    border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.06);
    color: #e5e7eb;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
    overflow: hidden;
  }
  .panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, #6366f1, #8b5cf6, #ec4899);
    opacity: 0.85;
  }
  .header {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 600;
    color: #f3f4f6;
  }
  .header .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #818cf8;
    box-shadow: 0 0 12px rgba(129, 140, 248, 0.7);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.85); }
  }
  .subtitle {
    font-size: 11px;
    color: #9ca3af;
    line-height: 1.5;
  }
  .progress-wrap {
    margin-top: 4px;
    height: 6px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #6366f1, #8b5cf6);
    border-radius: 999px;
    transition: width 0.4s ease;
    position: relative;
  }
  .progress-bar::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(90deg,
      transparent 0%, rgba(255, 255, 255, 0.25) 50%, transparent 100%);
    animation: shimmer 1.6s linear infinite;
  }
  @keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  .meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: #d1d5db;
  }
  .meta .pct { color: #a5b4fc; font-variant-numeric: tabular-nums; font-weight: 600; }
  .meta .nums { color: #9ca3af; font-variant-numeric: tabular-nums; }
  .footnote {
    font-size: 10px;
    color: #6b7280;
    margin-top: 2px;
  }
  .actions {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    margin-top: 2px;
  }
  .btn {
    -webkit-app-region: no-drag;
    cursor: pointer;
    background: rgba(99, 102, 241, 0.18);
    border: 1px solid rgba(99, 102, 241, 0.45);
    color: #c7d2fe;
    border-radius: 6px;
    padding: 3px 10px;
    font-size: 11px;
    font-family: inherit;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .btn:hover { background: rgba(99, 102, 241, 0.32); color: #ffffff; }
  .btn:active { transform: translateY(1px); }
  body.paused .header .dot {
    background: #fbbf24;
    box-shadow: 0 0 12px rgba(251, 191, 36, 0.7);
    animation: none;
  }
  body.paused .progress-bar::after { display: none; }
  body.done .progress-bar {
    background: linear-gradient(90deg, #10b981, #34d399);
  }
  body.done .progress-bar::after { display: none; }
  body.done .header .dot {
    background: #34d399;
    box-shadow: 0 0 12px rgba(52, 211, 153, 0.7);
    animation: none;
  }
</style>
</head>
<body>
<div class="panel">
  <div class="header"><span class="dot"></span><span id="title">正在重建向量索引</span></div>
  <div class="subtitle" id="subtitle">首次升级后正在补全历史记忆的向量化…完成后将自动消失</div>
  <div class="progress-wrap"><div class="progress-bar" id="bar"></div></div>
  <div class="meta">
    <span class="pct" id="pct">0%</span>
    <span class="nums" id="nums">--/--</span>
  </div>
  <div class="footnote" id="footnote">关闭此窗口不会停止任务,后台仍会跑完</div>
  <div class="actions">
    <button class="btn" id="pauseBtn">暂停</button>
  </div>
</div>
<script>
  const { ipcRenderer } = require('electron');
  const $title = document.getElementById('title');
  const $subtitle = document.getElementById('subtitle');
  const $bar = document.getElementById('bar');
  const $pct = document.getElementById('pct');
  const $nums = document.getElementById('nums');
  const $footnote = document.getElementById('footnote');
  const $pauseBtn = document.getElementById('pauseBtn');

  let isPaused = false;

  ipcRenderer.on('vector-progress:update', (_e, snap) => {
    const obs = snap?.indexer?.observations ?? { total: 0, embedded: 0, previouslyEmbedded: 0 };
    const sum = snap?.indexer?.summaries ?? { total: 0, embedded: 0, previouslyEmbedded: 0 };
    const total = (obs.total ?? 0) + (sum.total ?? 0);
    // 进度起点 = 之前已 embed + 本次新 embed。退出再开不再"从 0% 开始"。
    const previously = (obs.previouslyEmbedded ?? 0) + (sum.previouslyEmbedded ?? 0);
    const newlyEmbedded = (obs.embedded ?? 0) + (sum.embedded ?? 0);
    const done = previously + newlyEmbedded;
    const pct = total > 0 ? Math.min(100, Math.floor((done / total) * 100)) : 0;
    $bar.style.width = pct + '%';
    $pct.textContent = pct + '%';
    $nums.textContent = `${done.toLocaleString()} / ${total.toLocaleString()}`;

    const paused = !!snap?.indexer?.paused;
    if (paused !== isPaused) {
      isPaused = paused;
      document.body.classList.toggle('paused', paused);
      $pauseBtn.textContent = paused ? '继续' : '暂停';
      $title.textContent = paused ? '索引已暂停' : '正在重建向量索引';
      $footnote.textContent = paused
        ? '索引已暂停,关闭此窗口不会丢失进度'
        : '关闭此窗口不会停止任务,后台仍会跑完';
    }
  });

  ipcRenderer.on('vector-progress:done', () => {
    document.body.classList.remove('paused');
    document.body.classList.add('done');
    $title.textContent = '向量索引重建完成';
    $subtitle.textContent = '已就绪,2 秒后自动关闭';
    $bar.style.width = '100%';
    $pct.textContent = '100%';
    $pauseBtn.style.display = 'none';
  });

  $pauseBtn.addEventListener('click', () => {
    ipcRenderer.send(isPaused ? 'vector:resume' : 'vector:pause');
  });
</script>
</body>
</html>
