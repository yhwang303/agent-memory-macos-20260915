      renderSEOverview();
    }

    // ─────────── ShadwMonitor Tab data ───────────
    const SHADW_BASE = 'http://localhost:8080';
    let shadwLoaded = false;

    function escapeHtml(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      })[c]);
    }

    function formatHM(iso) {
      try {
        const d = new Date(iso);
        return d.toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit' });
      } catch (e) { return iso || ''; }
    }

    function shadwTimeAgo(iso) {
      if (!iso) return '';
      try {
        const diffMs = Date.now() - new Date(iso).getTime();
        if (isNaN(diffMs) || diffMs < 0) return '';
        const min = Math.floor(diffMs / 60000);
        if (min < 1) return '刚刚';
        if (min < 60) return `${min} 分钟前`;
        return `${Math.floor(min / 60)} 小时前`;
      } catch (e) { return ''; }
    }

    async function shadwFetch(path) {
      const res = await fetch(`${SHADW_BASE}${path}`, { mode: 'cors' });
      if (!res.ok) throw new Error(`${path} -> ${res.status}`);
      return res.json();
    }

    async function loadShadwData() {
      // Guard: panel may not exist if shadwmonitor tab was not created
      if (!document.getElementById('shadw-offline')) return;
      const offlineBanner = document.getElementById('shadw-offline');
      const connTag = document.getElementById('shadw-status-conn');
      const metaLine = document.getElementById('shadw-meta-line');
      const badge = document.getElementById('shadw-badge');

      // 同时拉 4 个端点；任何一个失败按离线处理
      let stats = null, timeline = null, apps = null, moments = null;
      let online = false;
      try {
        [stats, timeline, apps, moments] = await Promise.all([
          shadwFetch('/api/shadw/stats/today'),
          shadwFetch('/api/shadw/timeline/today'),
          shadwFetch('/api/shadw/apps/today'),
          shadwFetch('/api/shadw/moments?limit=20'),
        ]);
        online = true;
      } catch (e) {
        online = false;
        console.warn('ShadwMonitor 离线:', e);
      }

      if (!online) {
        offlineBanner.style.display = 'flex';
        connTag.textContent = '● OFFLINE';
        connTag.className = 'shadw-tag off';
        metaLine.textContent = 'ShadwMonitor 进程未启动 (端口 8080 不可达)';
        renderShadwFallback();
        return;
      }

      offlineBanner.style.display = 'none';
      connTag.textContent = '● ONLINE';
      connTag.className = 'shadw-tag on';

      // 顶部 meta
      const mirrored = stats.mirrored_today ?? 0;
      const rate = Math.round((stats.mirror_rate ?? 0) * 100);
      const retry = stats.retry_queue_size ?? 0;
      metaLine.innerHTML = `镜像率: <span style="color:var(--accent-warning)">${rate}%</span> &nbsp;·&nbsp; retry: <span style="color:${retry>0?'var(--accent-alert)':'var(--accent-active)'}">${retry}</span>`;

      // badge
      if (stats.l1_count > 0) {
        badge.textContent = stats.l1_count;
        badge.style.display = 'inline-flex';
      } else {
        badge.style.display = 'none';
      }

      // 4 格统计
      document.getElementById('shadw-l1-count').textContent = stats.l1_count ?? 0;
      document.getElementById('shadw-cap-count').textContent = stats.capture_count ?? 0;
      document.getElementById('shadw-hrs').innerHTML = `${(stats.active_hours ?? 0).toFixed(1)}<span style="font-size:18px">h</span>`;
      document.getElementById('shadw-apps-count-line').textContent = `${stats.apps_count ?? 0} 个应用`;
      document.getElementById('shadw-mirrored').innerHTML =
        `${mirrored}<span style="font-size:16px;color:var(--text-muted)">/${stats.l1_count ?? 0}</span>`;
      document.getElementById('shadw-mirror-delta').innerHTML =
        `<span style="color:${rate===100?'var(--accent-active)':'var(--accent-warning)'}">▲ ${rate}%</span> 镜像率 · retry: ${retry}`;

      renderShadwTimeline(timeline.segments || []);
      renderShadwApps(apps.apps || []);
      renderShadwMoments(moments.moments || []);
      document.getElementById('shadw-moments-label').textContent =
        `今日 L1 时刻 · 按时间倒序 · 显示 ${Math.min((moments.moments||[]).length, 20)} / ${stats.l1_count} 条`;
      shadwLoaded = true;
    }

    function renderShadwFallback() {
      // ShadwMonitor 离线：仅展示 agent-mem 已镜像的 screen_moment（暂不实现深度合并，直接给空态）
      document.getElementById('shadw-l1-count').textContent = '?';
      document.getElementById('shadw-cap-count').textContent = '?';
      document.getElementById('shadw-hrs').textContent = '?';
      document.getElementById('shadw-apps-count-line').textContent = '插件离线';
      document.getElementById('shadw-mirrored').textContent = '?';
      document.getElementById('shadw-mirror-delta').textContent = '插件离线';
      document.getElementById('shadw-timeline').innerHTML =
        '<div style="text-align:center;color:var(--text-muted);font-size:11px;line-height:40px;">插件离线，时间线不可见</div>';
      document.getElementById('shadw-apps').innerHTML =
        '<div style="color:var(--text-muted);font-size:11px;">插件离线，应用排行不可见</div>';
      document.getElementById('shadw-moments').innerHTML =
        '<div class="shadw-empty">ShadwMonitor 当前离线。<br>启动 <code style="color:var(--accent-warning);">python plugins/shadwmonitor/src/main.py capture</code> 后刷新页面。</div>';
    }

    function renderShadwTimeline(segments) {
      const el = document.getElementById('shadw-timeline');
      const legend = document.getElementById('shadw-timeline-legend');
      if (!segments.length) {
        el.innerHTML = '<div style="text-align:center;color:var(--text-muted);font-size:11px;line-height:40px;">今日还没有活动数据</div>';
        legend.innerHTML = '';
        return;
      }
      const allTs = segments.flatMap(s => [s.time_start, s.time_end]).filter(Boolean);
      const minTs = Math.min(...allTs.map(t => new Date(t).getTime()));
      const maxTs = Math.max(...allTs.map(t => new Date(t).getTime()));
      const span = Math.max(1, maxTs - minTs);

      let html = '';
      // 横向小时刻度
      const minH = new Date(minTs).getHours();
      const maxH = new Date(maxTs).getHours();
      for (let h = minH; h <= maxH; h++) {
        const t = new Date(minTs);
        t.setHours(h, 0, 0, 0);
        const pos = ((t.getTime() - minTs) / span) * 100;
        if (pos >= 0 && pos <= 100) {
          html += `<span class="shadw-timeline-hour" style="left:${pos}%">${String(h).padStart(2,'0')}</span>`;
        }
      }
      // 段
      for (const s of segments) {
        const t0 = new Date(s.time_start).getTime();
        const t1 = new Date(s.time_end).getTime();
        const left = ((t0 - minTs) / span) * 100;
        const width = Math.max(0.5, ((t1 - t0) / span) * 100);
        html += `<div class="shadw-timeline-bar" style="left:${left}%;width:${width}%;" title="${escapeHtml(s.app)} ${formatHM(s.time_start)}–${formatHM(s.time_end)}"></div>`;
      }
      el.innerHTML = html;
      legend.innerHTML = `${segments.length} 个活动段 · ${formatHM(segments[0].time_start)} → ${formatHM(segments[segments.length-1].time_end)}`;
    }

    function renderShadwApps(apps) {
      const el = document.getElementById('shadw-apps');
      if (!apps.length) {
        el.innerHTML = '<div style="color:var(--text-muted);font-size:11px;">今日还没有应用数据</div>';
        return;
      }
      const maxCap = Math.max(...apps.map(a => a.capture_count || 0), 1);
      el.innerHTML = apps.slice(0, 6).map(a => {
        const pct = Math.max(2, Math.round((a.capture_count / maxCap) * 100));
        const hours = ((a.duration_seconds || 0) / 3600).toFixed(1);
        return `
          <div class="shadw-app-row">
            <span class="shadw-app-name" title="${escapeHtml(a.app)}">${escapeHtml(a.app)}</span>
            <div class="shadw-app-bar"><div class="shadw-app-fill" style="width:${pct}%"></div></div>
            <span class="shadw-app-count">${hours}h <span style="color:var(--accent-warning)">${a.moment_count || 0}</span></span>
          </div>
        `;
      }).join('');
    }

    function renderShadwMoments(moments) {
      const el = document.getElementById('shadw-moments');
      if (!moments.length) {
        el.innerHTML = '<div class="shadw-empty">今日还没有 L1 时刻产生。<br>等截屏积累 ≥ 2 张并在窗口期内蒸馏后会出现。</div>';
        return;
      }
      el.innerHTML = moments.map(m => {
        const apps = (m.app_names || []).slice(0, 3).map(a =>
          `<span class="shadw-tag" style="background:rgba(0,212,170,0.09);border-color:rgba(0,212,170,0.28);color:var(--accent-primary)">${escapeHtml(a)}</span>`
        ).join(' ');
        const thumbs = (m.screenshot_paths || []).slice(0, 2).map(p =>
          `<span style="font-family:var(--font-body);font-size:10px;color:var(--accent-warning);">▣ ${escapeHtml(p.split(/[\\/]/).pop() || p)}</span>`
        ).join(' &nbsp; ');
        const moreShot = (m.screenshot_paths || []).length > 2 ? `+ ${m.screenshot_paths.length - 2} 张` : '';
        return `
          <div class="shadw-moment-card">
            <div class="shadw-moment-head">
              <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:0;">
                <span class="shadw-time-badge">${formatHM(m.time_start)}–${formatHM(m.time_end)}</span>
                <div class="shadw-moment-title">${escapeHtml(m.summary?.slice(0, 60) || '(无内容)')}</div>
              </div>
              <div style="font-family:var(--font-body);font-size:10px;color:var(--text-muted);white-space:nowrap;">
                ${m.capture_count} 张 · ${shadwTimeAgo(m.time_end)}
              </div>
            </div>
            <div class="shadw-moment-narrative">${escapeHtml(m.summary || '')}</div>
            <div class="shadw-moment-meta">
              ${apps}
              <span class="shadw-tag amber">已镜像 agent-mem</span>
              ${thumbs}
              ${moreShot ? `<span style="color:var(--text-muted);">${moreShot}</span>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    async function loadSEData() {
      const wsParam = seCurrentWs ? `?workspace=${encodeURIComponent(seCurrentWs)}` : '';
      try {
        const [rulesRes, skillsRes, logRes, statusRes] = await Promise.all([
          fetch(`${API_BASE}/api/viewer/rules${wsParam}`),
          fetch(`${API_BASE}/api/viewer/skills${wsParam}`),
          fetch(`${API_BASE}/api/viewer/evo-log${wsParam}`),
          fetch(`${API_BASE}/api/self-evolve/status`).catch(() => null),
        ]);
        const [rulesJson, skillsJson, logJson] = await Promise.all([
          rulesRes.json(), skillsRes.json(), logRes.json(),
        ]);
        seRules  = rulesJson.success  ? rulesJson.data  : [];
        seSkills = skillsJson.success ? skillsJson.data : [];
        seEvoLog = logJson.success    ? logJson.data    : [];
        if (statusRes) {
          const statusJson = await statusRes.json().catch(() => null);
          seStatus = statusJson?.success ? statusJson.data : null;
        }
        populateSEWorkspaces();
        updateSEHeader();
        renderSEPanel();
      } catch (err) {
        console.error('Failed to load SE data:', err);
        seToast('数据加载失败，请确认 worker 服务正在运行', 'err');
      }
    }

    function populateSEWorkspaces() {
      // Merge workspaces from Self-Evolve data with the global project list, so a
      // fresh install (whose Self-Evolve tables are still empty) can still pick a
      // workspace and bootstrap the first evolution — instead of being stuck with
      // only "所有工作区" and getting "workspace is required" on trigger.
      const projectOpts = projectFilter
        ? [...projectFilter.options].map(o => o.value).filter(Boolean)
        : [];
      const workspaces = [...new Set([
        ...seRules.map(r => r.workspace),
        ...seSkills.map(s => s.workspace),
        ...seEvoLog.map(e => e.workspace),
        ...projectOpts,
      ].filter(Boolean))].sort();

      ['#se-overview-ws', '#se-rules-ws', '#se-skills-ws', '#se-log-ws'].forEach(sel => {
        const el = document.querySelector(sel);
        if (!el) return;
        const cur = el.value;
        el.innerHTML = '<option value="">所有工作区</option>';
        workspaces.forEach(ws => {
          const short = ws.split(/[/\\]/).pop() || ws;
          const opt = document.createElement('option');
          opt.value = ws; opt.textContent = short;
          el.appendChild(opt);
        });
        if ([...el.options].some(o => o.value === cur)) el.value = cur;
      });

      // Default the overview workspace so "触发进化" has a target even before the
      // user touches the dropdown: prefer the globally selected project, otherwise
      // the only available workspace when there is exactly one.
      if (!seCurrentWs) {
        const overviewEl = document.querySelector('#se-overview-ws');
        let preset = '';
        if (currentProject && workspaces.includes(currentProject)) preset = currentProject;
        else if (workspaces.length === 1) preset = workspaces[0];
        if (preset) {
          seCurrentWs = preset;
          if (overviewEl) overviewEl.value = preset;
        }
      }

      const cats = [...new Set(seRules.map(r => r.category).filter(Boolean))].sort();
      const catSel = document.getElementById('se-rules-cat');
      if (catSel) {
        catSel.innerHTML = '<option value="">所有分类</option>';
        cats.forEach(cat => {
          const opt = document.createElement('option');
          opt.value = cat; opt.textContent = cat;
          catSel.appendChild(opt);
        });
      }
    }

    function updateSEHeader() {
      const statusTags = document.getElementById('se-status-tags');
      const statusInfo = document.getElementById('se-status-info');
      if (statusTags && seStatus) {
        const enabled = seStatus.enabled;
        statusTags.innerHTML = `
          <span class="plugin-tag ${enabled ? 'pt-on' : 'pt-off'}">${enabled ? '● ENABLED' : '○ DISABLED'}</span>
          ${seStatus.currentState === 'running' ? '<span class="plugin-tag pt-mode">RUNNING</span>' : ''}
        `;
      }
      const pending = seRules.filter(r => r.audit_status === 'pending').length
                    + seSkills.filter(s => s.audit_status === 'pending').length;
      const totalRules  = seRules.filter(r => r.status === 'active').length;
      const totalSkills = seSkills.filter(s => s.status === 'active').length;
      const wsCount = new Set([...seRules, ...seSkills, ...seEvoLog].map(x => x.workspace).filter(Boolean)).size;
      if (statusInfo) {
        statusInfo.innerHTML = `${wsCount} 工作区 &nbsp;·&nbsp; ${totalRules} Rules &nbsp;·&nbsp; ${totalSkills} Skills &nbsp;·&nbsp; `
          + (pending > 0 ? `<span style="color:var(--accent-warning)">${pending} Pending</span>` : '0 Pending');
      }
      const badge = document.getElementById('se-badge');
      if (badge) { badge.textContent = pending; badge.style.display = pending > 0 ? 'inline-flex' : 'none'; }
      const rBadge = document.getElementById('se-rules-badge');
      if (rBadge) { rBadge.textContent = pending; rBadge.style.display = pending > 0 ? 'inline-block' : 'none'; }
    }

    function renderSEPanel() {
      switch (seCurrentTab) {
        case 'overview': renderSEOverview(); break;
        case 'rules':    renderSERules();    break;
        case 'skills':   renderSESkills();   break;
        case 'evo-log':  renderSEEvoLog();   break;
      }
    }

    function renderSEOverview() {
      // Guard: panel may not exist yet if plugin tab hasn't been created
      if (!document.getElementById('ov-rules')) return;
      const wsFilter = document.getElementById('se-overview-ws')?.value || '';
      const rules  = wsFilter ? seRules.filter(r => r.workspace === wsFilter)  : seRules;
      const skills = wsFilter ? seSkills.filter(s => s.workspace === wsFilter) : seSkills;
      const logs   = wsFilter ? seEvoLog.filter(e => e.workspace === wsFilter) : seEvoLog;

      const activeRules  = rules.filter(r => r.status === 'active');
      const activeSkills = skills.filter(s => s.status === 'active');
      const pending  = rules.filter(r => r.audit_status === 'pending').length
                     + skills.filter(s => s.audit_status === 'pending').length;
      const archived = rules.filter(r => r.status === 'archived').length
                     + skills.filter(s => s.status === 'archived').length;

      document.getElementById('ov-rules').textContent    = activeRules.length;
      document.getElementById('ov-skills').textContent   = activeSkills.length;
      document.getElementById('ov-pending').textContent  = pending;
      document.getElementById('ov-archived').textContent = archived;

      const catColors = { '代码规范':'var(--accent-primary)', '用户偏好':'var(--accent-purple)', '工作流规范':'var(--accent-warning)', '技术栈偏好':'var(--accent-blue)' };
      const ruleCats = {};
      activeRules.forEach(r => { const c = r.category || '其他'; ruleCats[c] = (ruleCats[c] || 0) + 1; });
      const maxR = Math.max(1, ...Object.values(ruleCats));
      document.getElementById('se-cat-rules').innerHTML = Object.entries(ruleCats).sort((a,b)=>b[1]-a[1])
        .map(([cat, cnt]) => `<div class="cat-row"><span class="cat-name">${escapeHtml(cat)}</span><div class="cat-bar-wrap"><div class="cat-bar-fill" style="width:${Math.round(cnt/maxR*100)}%;background:${catColors[cat]||'var(--accent-primary)'};"></div></div><span class="cat-count">${cnt}</span></div>`)
        .join('') || '<div style="color:var(--text-muted);font-size:12px;padding:4px 0;">暂无数据</div>';

      const skillKinds = {};
      activeSkills.forEach(s => { const k = s.skill_kind || 'markdown'; skillKinds[k] = (skillKinds[k] || 0) + 1; });
      const maxS = Math.max(1, ...Object.values(skillKinds));
      document.getElementById('se-cat-skills').innerHTML = Object.entries(skillKinds).sort((a,b)=>b[1]-a[1])
        .map(([kind, cnt]) => `<div class="cat-row"><span class="cat-name">${escapeHtml(kind)}</span><div class="cat-bar-wrap"><div class="cat-bar-fill" style="width:${Math.round(cnt/maxS*100)}%;background:#f472b6;"></div></div><span class="cat-count">${cnt}</span></div>`)
        .join('') || '<div style="color:var(--text-muted);font-size:12px;padding:4px 0;">暂无数据</div>';

      // Render inventory lists with toggle switches
      renderSEInventory(rules, skills);

      renderSEChart(logs);
    }

    function renderSEInventory(rules, skills) {
      const rList = document.getElementById('se-inv-rules-list');
      const sList = document.getElementById('se-inv-skills-list');
      if (!rList || !sList) return;

      // Sort: active first, then by date desc
      const sortedRules = [...rules].sort((a,b) => (a.status==='archived'?1:0)-(b.status==='archived'?1:0) || new Date(b.created_at)-new Date(a.created_at));
      const sortedSkills = [...skills].sort((a,b) => (a.status==='archived'?1:0)-(b.status==='archived'?1:0) || new Date(b.created_at)-new Date(a.created_at));

      document.getElementById('se-inv-rules-count').textContent = rules.length;
      document.getElementById('se-inv-skills-count').textContent = skills.length;

      rList.innerHTML = sortedRules.length
        ? sortedRules.map(r => seInvRuleCard(r)).join('')
        : '<div class="se-empty" style="padding:20px;">暂无规则</div>';
      sList.innerHTML = sortedSkills.length
        ? sortedSkills.map(s => seInvSkillCard(s)).join('')
        : '<div class="se-empty" style="padding:20px;">暂无技能</div>';
    }

    function seInvRuleCard(r) {
      const on = r.status === 'active';
      const sc = (r.quality_score||0) >= 80 ? 'ihi' : (r.quality_score||0) >= 60 ? 'imid' : 'ilo';
      const audit = r.audit_status === 'pending' ? '<span class="inv-tag it-pending">⚑ 待审核</span>'
        : r.audit_status === 'approved' ? '<span class="inv-tag it-approved">✓ 已批准</span>'
        : '<span class="inv-tag it-auto">自动</span>';
      const id = 'inv-r-' + r.id;
      return `<div class="inv-item ${on ? '' : 'inv-archived'}" id="${id}">
        <div class="inv-row">
          <div class="inv-toggle ${on ? 'on' : ''}" onclick="event.stopPropagation();seInvToggle(${r.id},'rule')"></div>
          <span class="inv-chevron" onclick="seInvExpand('${id}')">▶</span>
          <div class="inv-info" onclick="seInvExpand('${id}')">
            <div class="inv-title">${escapeHtml(r.title)}</div>
            <div class="inv-meta">${r.category ? `<span class="inv-tag it-cat">${escapeHtml(r.category)}</span>` : ''}${audit}</div>
          </div>
          ${r.quality_score != null ? `<span class="inv-score ${sc}">${r.quality_score}</span>` : ''}
          <span class="inv-date">${formatDate(r.created_at)}</span>
        </div>
        <div class="inv-ide-targets" ${on ? '' : 'style="opacity:0.4"'}>
          <span class="inv-ide-label">写入:</span>
          ${SE_IDE_OPTIONS.map(ide => `<span class="inv-ide-chip ${seGetIdeState(r.id,'rule',ide.id)?'ide-on':'ide-off'}" onclick="event.stopPropagation();seToggleIde(${r.id},'rule','${ide.id}')">${ide.name}</span>`).join('')}
        </div>
        <div class="inv-detail">
          <div class="inv-detail-lbl">规则内容</div>
          <div class="inv-detail-box">${escapeHtml(r.content || '')}</div>
          ${r.evidence ? `<div class="inv-detail-lbl">支撑证据</div><div class="inv-detail-box">${escapeHtml(r.evidence)}</div>` : ''}
          <div class="inv-detail-foot">${r.source_session_id ? `<span>来源: ${escapeHtml(r.source_session_id.slice(0,8))}</span>` : ''}<span>质量: ${r.quality_score ?? '-'}/100</span></div>
        </div>
      </div>`;
    }

    function seInvSkillCard(s) {
      const on = s.status === 'active';
      const sc = (s.quality_score||0) >= 80 ? 'ihi' : (s.quality_score||0) >= 60 ? 'imid' : 'ilo';
      const audit = s.audit_status === 'pending' ? '<span class="inv-tag it-pending">⚑ 待审核</span>'
        : s.audit_status === 'approved' ? '<span class="inv-tag it-approved">✓ 已批准</span>'
        : '<span class="inv-tag it-auto">自动</span>';
      const id = 'inv-s-' + s.id;
      return `<div class="inv-item ${on ? '' : 'inv-archived'}" id="${id}">
        <div class="inv-row">
          <div class="inv-toggle ${on ? 'on' : ''}" onclick="event.stopPropagation();seInvToggle(${s.id},'skill')"></div>
          <span class="inv-chevron" onclick="seInvExpand('${id}')">▶</span>
          <div class="inv-info" onclick="seInvExpand('${id}')">
            <div class="inv-title">${escapeHtml(s.name || s.slug)}</div>
            <div class="inv-meta"><span class="inv-tag it-kind">${escapeHtml(s.skill_kind || 'markdown')}</span>${audit}${s.trigger_scene ? `<span class="inv-tag it-auto" style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(s.trigger_scene)}</span>` : ''}</div>
          </div>
          ${s.quality_score != null ? `<span class="inv-score ${sc}">${s.quality_score}</span>` : ''}
          <span class="inv-date">${formatDate(s.created_at)}</span>
        </div>
        <div class="inv-ide-targets" ${on ? '' : 'style="opacity:0.4"'}>
          <span class="inv-ide-label">写入:</span>
          ${SE_IDE_OPTIONS.map(ide => `<span class="inv-ide-chip ${seGetIdeState(s.id,'skill',ide.id)?'ide-on':'ide-off'}" onclick="event.stopPropagation();seToggleIde(${s.id},'skill','${ide.id}')">${ide.name}</span>`).join('')}
        </div>
        <div class="inv-detail">
          <div class="inv-detail-lbl">Skill 内容</div>
          <div class="inv-detail-box">${escapeHtml((s.skill_md || '').slice(0, 600))}${(s.skill_md||'').length > 600 ? '\n...' : ''}</div>
          <div class="inv-detail-foot"><span>slug: ${escapeHtml(s.slug || '')}</span><span>质量: ${s.quality_score ?? '-'}/100</span></div>
        </div>
      </div>`;
    }

    function seInvExpand(id) {
      const el = document.getElementById(id);
      if (el) el.classList.toggle('inv-expanded');
    }

    // ── Multi-IDE write support ──────────────────────────────────────────────
    const SE_IDE_OPTIONS = [
      { id: 'claudecode', name: 'Claude Code' },
      { id: 'cursor', name: 'Cursor' },
      { id: 'codebuddy', name: 'CodeBuddy' },
    ];

    // Track per-item IDE selections in memory (default: claudecode)
    const seIdeSelections = {}; // key: `${type}-${id}` → Set of ide ids

    function seGetIdeKey(id, type) { return `${type}-${id}`; }

    function seGetIdeState(id, type, ideId) {
      const key = seGetIdeKey(id, type);
      if (!seIdeSelections[key]) {
        seIdeSelections[key] = new Set(['claudecode']); // default
      }
      return seIdeSelections[key].has(ideId);
    }

    function seToggleIde(id, type, ideId) {
      const key = seGetIdeKey(id, type);
      if (!seIdeSelections[key]) {
        seIdeSelections[key] = new Set(['claudecode']);
      }
      const set = seIdeSelections[key];
      if (set.has(ideId)) {
        if (set.size > 1) set.delete(ideId); // don't allow 0 selections
      } else {
        set.add(ideId);
      }
      // Re-render the item
      const wsFilter = document.getElementById('se-overview-ws')?.value || '';
      const rules  = wsFilter ? seRules.filter(r => r.workspace === wsFilter) : seRules;
      const skills = wsFilter ? seSkills.filter(s => s.workspace === wsFilter) : seSkills;
      renderSEInventory(rules, skills);

      // If item is active, trigger re-write with new platforms
      const item = type === 'rule' ? seRules.find(r => r.id === id) : seSkills.find(s => s.id === id);
      if (item && item.status === 'active') {
        const platforms = [...set];
        fetch(`${API_BASE}/api/self-evolve/review/approve`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, type, targetPlatforms: platforms }),
        }).then(r => {
          if (r.ok) seToast(`已写入 ${platforms.join(' + ')}`, 'ok');
        }).catch(() => {});
      }
    }

    async function seInvToggle(id, type) {
      const newStatus = type === 'rule'
        ? (seRules.find(r=>r.id===id)?.status === 'active' ? 'archived' : 'active')
        : (seSkills.find(s=>s.id===id)?.status === 'active' ? 'archived' : 'active');
      try {
        const key = seGetIdeKey(id, type);
        const platforms = seIdeSelections[key] ? [...seIdeSelections[key]] : ['claudecode'];
        const endpoint = `${API_BASE}/api/self-evolve/review/${newStatus === 'archived' ? 'reject' : 'approve'}`;
        const resp = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, type, status: newStatus, targetPlatforms: platforms }),
        });
        if (!resp.ok) throw new Error('API 请求失败');
        // Update local state
        if (type === 'rule') {
          const r = seRules.find(x => x.id === id);
          if (r) r.status = newStatus;
        } else {
          const s = seSkills.find(x => x.id === id);
          if (s) s.status = newStatus;
        }
        const wsFilter = document.getElementById('se-overview-ws')?.value || '';
        const rules  = wsFilter ? seRules.filter(r => r.workspace === wsFilter) : seRules;
        const skills = wsFilter ? seSkills.filter(s => s.workspace === wsFilter) : seSkills;
        renderSEInventory(rules, skills);
        renderSEOverview();
        seToast(newStatus === 'active' ? `已启用，写入 ${platforms.join(' + ')}` : '已归档', 'ok');
      } catch (err) {
        seToast('操作失败: ' + err.message, 'err');
      }
    }

    function renderSEChart(logs) {
      const wrap = document.getElementById('se-chart-wrap');
      if (!wrap) return;
      if (logs.length === 0) { wrap.innerHTML = '<div class="se-empty" style="padding:24px 20px;">暂无进化记录</div>'; return; }

      const sorted = [...logs].sort((a,b) => new Date(a.created_at) - new Date(b.created_at));
      const pts = sorted.slice(-6);
      if (pts.length < 2) {
        wrap.innerHTML = `<div style="padding:16px;font-size:12px;color:var(--text-muted);font-family:var(--font-body);">进化记录不足，继续使用即可看到增长趋势图表。当前：${logs.length} 次进化</div>`;
        return;
      }

      const rData = pts.map(p => (p.total_rules_after ?? p.rules_added ?? 0));
      const sData = pts.map(p => (p.total_skills_after ?? p.skills_added ?? 0));
      const labels = pts.map(p => { const d = new Date(p.created_at); return `${d.getMonth()+1}/${d.getDate()}`; });
      const maxVal = Math.max(...rData, ...sData, 1);
      const W=480, H=170, PL=46, PR=10, PT=20, PB=22;
      const plotW = W-PL-PR, plotH = H-PT-PB, n = pts.length;
      const xP = i => PL + (i/(n-1))*plotW;
      const yP = v => PT + plotH - (v/maxVal)*plotH;
      const rPts = rData.map((v,i)=>`${xP(i)},${yP(v)}`).join(' ');
      const sPts = sData.map((v,i)=>`${xP(i)},${yP(v)}`).join(' ');
      const rArea = `M${xP(0)},${yP(rData[0])} ${rData.map((v,i)=>i?`L${xP(i)},${yP(v)}`:''). join('')} L${xP(n-1)},${PT+plotH} L${xP(0)},${PT+plotH} Z`;
      const sArea = `M${xP(0)},${yP(sData[0])} ${sData.map((v,i)=>i?`L${xP(i)},${yP(v)}`:''). join('')} L${xP(n-1)},${PT+plotH} L${xP(0)},${PT+plotH} Z`;
      wrap.innerHTML = `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
        <line x1="${PL}" y1="${PT}" x2="${W-PR}" y2="${PT}" stroke="rgba(0,212,170,0.07)" stroke-width="1"/>
        <line x1="${PL}" y1="${PT+plotH/2}" x2="${W-PR}" y2="${PT+plotH/2}" stroke="rgba(0,212,170,0.07)" stroke-width="1"/>
        <line x1="${PL}" y1="${PT+plotH}" x2="${W-PR}" y2="${PT+plotH}" stroke="rgba(0,212,170,0.15)" stroke-width="1"/>
        <text x="${PL-6}" y="${PT+4}" text-anchor="end" fill="rgba(208,232,228,0.25)" font-size="9" font-family="JetBrains Mono,monospace">${maxVal}</text>
        <text x="${PL-6}" y="${PT+plotH/2+4}" text-anchor="end" fill="rgba(208,232,228,0.25)" font-size="9" font-family="JetBrains Mono,monospace">${Math.round(maxVal/2)}</text>
        <text x="${PL-6}" y="${PT+plotH+4}" text-anchor="end" fill="rgba(208,232,228,0.25)" font-size="9" font-family="JetBrains Mono,monospace">0</text>
        <path d="${rArea}" fill="rgba(0,212,170,0.07)"/>
        <polyline points="${rPts}" fill="none" stroke="#00d4aa" stroke-width="2" stroke-linejoin="round"/>
        <path d="${sArea}" fill="rgba(244,114,182,0.05)"/>
        <polyline points="${sPts}" fill="none" stroke="#f472b6" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5,3"/>
        ${rData.map((v,i)=>`<circle cx="${xP(i)}" cy="${yP(v)}" r="3.5" fill="#00d4aa" stroke="rgba(6,10,12,0.8)" stroke-width="1.5"/>`).join('')}
        ${sData.map((v,i)=>`<circle cx="${xP(i)}" cy="${yP(v)}" r="3" fill="#f472b6" stroke="rgba(6,10,12,0.8)" stroke-width="1.5"/>`).join('')}
        ${labels.map((l,i)=>`<text x="${xP(i)}" y="${H-3}" text-anchor="middle" fill="rgba(208,232,228,0.3)" font-size="9" font-family="JetBrains Mono,monospace">${l}</text>`).join('')}
        <rect x="${PL}" y="6" width="16" height="3" fill="#00d4aa" rx="1.5"/>
        <text x="${PL+20}" y="11" fill="rgba(208,232,228,0.45)" font-size="9" font-family="JetBrains Mono,monospace">Rules</text>
        <line x1="${PL+64}" y1="8" x2="${PL+80}" y2="8" stroke="#f472b6" stroke-width="2" stroke-dasharray="5,3"/>
        <text x="${PL+84}" y="11" fill="rgba(208,232,228,0.45)" font-size="9" font-family="JetBrains Mono,monospace">Skills</text>
      </svg>`;
    }

    function seCatClass(category) {
      const c = (category || '').toLowerCase();
      if (c.includes('代码') || c.includes('code')) return 'c-code';
      if (c.includes('用户') || c.includes('user')) return 'c-user';
      if (c.includes('工作流') || c.includes('workflow')) return 'c-workflow';
      if (c.includes('技术') || c.includes('tech')) return 'c-tech';
      return 'c-code';
    }
    function seCatTag(category) { return seCatClass(category).replace('c-','t-'); }

    function renderSERules() {
      if (!document.getElementById('se-rules-list')) return;
      const catFilter   = document.getElementById('se-rules-cat')?.value   || '';
      const auditFilter = document.getElementById('se-rules-audit')?.value || '';
      const wsFilter    = document.getElementById('se-rules-ws')?.value    || '';
      let rules = seRules;
      if (catFilter)   rules = rules.filter(r => r.category === catFilter);
      if (auditFilter) rules = rules.filter(r => r.audit_status === auditFilter);
      if (wsFilter)    rules = rules.filter(r => r.workspace === wsFilter);

      const pendingRules   = rules.filter(r => r.audit_status === 'pending');
      const nonPendingRules = rules.filter(r => r.audit_status !== 'pending');
      const alert = document.getElementById('se-rules-alert');
      const alertText = document.getElementById('se-rules-alert-text');
      if (pendingRules.length > 0 && !auditFilter) {
        alert.style.display = 'flex';
        alertText.textContent = `${pendingRules.length} 条规则等待审核，批准后写入 CLAUDE.md 和 .cursor/rules/`;
      } else { alert.style.display = 'none'; }

      const list = document.getElementById('se-rules-list');
      if (rules.length === 0) { list.innerHTML = '<div class="se-empty">暂无符合条件的规则</div>'; return; }
      const sec = (items, label) => items.length === 0 ? '' :
        `<div class="section-label">${label}</div><div class="card-list" style="margin-bottom:18px;">${items.map(seRuleCard).join('')}</div>`;
      list.innerHTML = auditFilter
        ? `<div class="card-list">${rules.map(seRuleCard).join('')}</div>`
        : sec(pendingRules, '待审核 · Pending Review') + sec(nonPendingRules, '已生效 · Active Rules');
    }

    function seRuleCard(r) {
      const id = `r-${r.id}`;
      const qScore = r.quality_score;
      const qCls = qScore >= 80 ? 'q-hi' : 'q-mid';
      const isPending = r.audit_status === 'pending';
      const wsShort = (r.workspace || '').split(/[/\\]/).pop() || '';
      return `<div class="card ${seCatClass(r.category)}" id="${id}">
        <div class="card-collapsed" onclick="seToggle('${id}')">
          <div class="card-header">
            <div class="card-left"><span class="chevron">▶</span><div class="card-title">${escapeHtml(r.title)}</div></div>
            <div class="card-right">${qScore != null ? `<span class="q-score ${qCls}">${qScore}</span>` : ''}<span class="card-date">${formatDate(r.created_at)}</span></div>
          </div>
          <div class="card-meta">
            ${r.category ? `<span class="tag ${seCatTag(r.category)}">${escapeHtml(r.category)}</span>` : ''}
            ${isPending ? '<span class="tag t-pending">⚑ 待审核</span>' : `<span class="tag ${r.audit_status === 'approved' ? 't-approved' : 't-auto'}">${r.audit_status === 'approved' ? '✓ 已批准' : '自动'}</span>`}
            ${wsShort ? `<span class="tag t-workspace">${escapeHtml(wsShort)}</span>` : ''}
          </div>
        </div>
        <div class="card-expanded"><div class="expand-body">
          <div class="expand-sec"><div class="expand-lbl">规则内容</div><div class="expand-box">${escapeHtml(r.content || '')}</div></div>
          ${r.evidence ? `<div class="expand-sec"><div class="expand-lbl">支撑证据</div><div class="expand-box">${escapeHtml(r.evidence)}</div></div>` : ''}
          <div class="expand-mini">${r.source_session_id ? `<span>来源：Session ${escapeHtml(r.source_session_id.slice(0,8))}</span>` : ''}${qScore != null ? `<span>质量：${qScore}/100</span>` : ''}</div>
          ${isPending ? `<div class="expand-actions">
            <button class="btn btn-approve" onclick="seApprove(${r.id},'rule',this)">✓ 批准并写入</button>
            <button class="btn btn-reject" onclick="seShowReject('${id}')">✗ 拒绝</button>
            <span class="sp"></span><span class="hint">批准后写入 CLAUDE.md 托管区</span>
          </div>
          <div class="reject-form" id="rf-${id}">
            <div style="font-size:11px;color:var(--accent-alert);margin-bottom:5px;">拒绝原因（可选）</div>
            <textarea id="rf-text-${id}" placeholder="例如：场景过于特殊，不适合作为通用规范..."></textarea>
            <div class="reject-form-btns">
              <button class="btn btn-reject" onclick="seDoReject(${r.id},'rule','${id}')">确认拒绝</button>
              <button class="btn btn-ghost" onclick="seHideReject('${id}')">取消</button>
            </div>
          </div>` : ''}
        </div></div>
      </div>`;
    }

    function renderSESkills() {
      if (!document.getElementById('se-skills-list')) return;
      const wsFilter = document.getElementById('se-skills-ws')?.value || '';
      const skills = wsFilter ? seSkills.filter(s => s.workspace === wsFilter) : seSkills;
      const list = document.getElementById('se-skills-list');
      if (skills.length === 0) { list.innerHTML = '<div class="se-empty">暂无技能记录</div>'; return; }
      const pending = skills.filter(s => s.audit_status === 'pending');
      const other   = skills.filter(s => s.audit_status !== 'pending');
      const sec = (items, label) => items.length === 0 ? '' :
        `<div class="section-label">${label}</div><div class="card-list" style="margin-bottom:18px;">${items.map(seSkillCard).join('')}</div>`;
      list.innerHTML = sec(pending, '待审核 · Pending Skills') + sec(other, '已生效 · Active Skills');
    }

    function seSkillCard(s) {
      const id = `sk-${s.id}`;
      const qScore = s.quality_score;
      const qCls = qScore >= 80 ? 'q-hi' : 'q-mid';
      const isPending = s.audit_status === 'pending';
      const wsShort = (s.workspace || '').split(/[/\\]/).pop() || '';
      return `<div class="card c-skill" id="${id}">
        <div class="card-collapsed" onclick="seToggle('${id}')">
          <div class="card-header">
            <div class="card-left"><span class="chevron">▶</span><div>
              <div class="card-title">${escapeHtml(s.name || s.slug)}</div>
              ${s.trigger_scene ? `<div class="skill-trigger">触发场景：${escapeHtml(s.trigger_scene)}</div>` : ''}
            </div></div>
            <div class="card-right">${qScore != null ? `<span class="q-score ${qCls}">${qScore}</span>` : ''}<span class="card-date">${formatDate(s.created_at)}</span></div>
          </div>
          <div class="card-meta">
            <span class="tag t-skill">${escapeHtml(s.skill_kind || 'markdown')}</span>
            ${isPending ? '<span class="tag t-pending">⚑ 待审核</span>' : `<span class="tag ${s.audit_status === 'approved' ? 't-approved' : 't-auto'}">${s.audit_status === 'approved' ? '✓ 已批准' : '自动'}</span>`}
            ${wsShort ? `<span class="tag t-workspace">${escapeHtml(wsShort)}</span>` : ''}
          </div>
        </div>
        <div class="card-expanded"><div class="expand-body">
          ${s.skill_md ? `<div class="expand-sec"><div class="expand-lbl">SKILL.md</div><div class="expand-box" style="font-size:11px;line-height:1.8;color:var(--text-secondary);max-height:200px;overflow-y:auto;">${escapeHtml(s.skill_md.slice(0,800))}${s.skill_md.length > 800 ? '\n...' : ''}</div></div>` : ''}
          <div class="expand-mini"><span>slug: ${escapeHtml(s.slug || '')}</span>${s.source_session_id ? `<span>来源：${escapeHtml(s.source_session_id.slice(0,8))}</span>` : ''}</div>
          ${isPending ? `<div class="expand-actions">
            <button class="btn btn-approve" onclick="seApprove(${s.id},'skill',this)">✓ 批准</button>
            <button class="btn btn-reject" onclick="seShowReject('${id}')">✗ 拒绝</button>
          </div>
          <div class="reject-form" id="rf-${id}">
            <textarea id="rf-text-${id}" placeholder="拒绝原因..."></textarea>
            <div class="reject-form-btns">
              <button class="btn btn-reject" onclick="seDoReject(${s.id},'skill','${id}')">确认</button>
              <button class="btn btn-ghost" onclick="seHideReject('${id}')">取消</button>
            </div>
          </div>` : `<div class="expand-actions"><span class="hint">已写入 .claude/skills/${escapeHtml(s.slug || '')}/</span></div>`}
        </div></div>
      </div>`;
    }

    function renderSEEvoLog() {
      if (!document.getElementById('se-evo-log-list')) return;
      const wsFilter = document.getElementById('se-log-ws')?.value || '';
      const logs = wsFilter ? seEvoLog.filter(e => e.workspace === wsFilter) : seEvoLog;
      const list = document.getElementById('se-evo-log-list');
      if (logs.length === 0) { list.innerHTML = '<div class="se-empty">暂无进化日志</div>'; return; }
      list.innerHTML = logs.map(e => {
        const id = `el-${e.id}`;
        const wsShort = (e.workspace || '').split(/[/\\]/).pop() || '';
        const status = e.status || 'unknown';
        const statusTag = status === 'completed' ? '<span class="tag t-clean">SUCCESS</span>'
          : status === 'skipped' ? '<span class="tag t-auto">SKIPPED</span>'
          : status === 'failed' ? '<span class="tag t-rejected">FAILED</span>'
          : '<span class="tag t-auto">RUNNING</span>';
        const cardCls = status === 'completed' ? 'c-ok'
          : status === 'skipped' ? 'c-skip'
          : status === 'failed' ? 'c-skip' : 'c-pending';
        const rDelta = e.rules_added ?? 0, sDelta = e.skills_added ?? 0;
        const elapsed = e.duration_ms ? `<span class="ec d">⏱ ${(e.duration_ms/1000).toFixed(1)}s</span>` : '';
        const sessionShort = (e.memory_session_id || '').slice(0, 8);
        return `<div class="card ${cardCls}" id="${id}">
          <div class="card-collapsed" onclick="seToggle('${id}')">
            <div class="card-header">
              <div class="card-left"><span class="chevron">▶</span><div>
                <div class="card-title">Session ${escapeHtml(sessionShort)}${wsShort ? ` · ${escapeHtml(wsShort)}` : ''}</div>
                <div class="evo-counts">
                  <span class="ec r"><span class="n">+${rDelta}</span> Rules</span>
                  <span class="ec s"><span class="n">+${sDelta}</span> Skills</span>
                  ${elapsed}${wsShort ? `<span class="tag t-workspace" style="margin-left:4px;">${escapeHtml(wsShort)}</span>` : ''}
                </div>
              </div></div>
              <div class="card-right">${statusTag}<span class="card-date">${formatDate(e.created_at)}</span></div>
            </div>
          </div>
          <div class="card-expanded"><div class="expand-body">
            ${status === 'skipped' && e.error_message ? `<div class="expand-sec"><div class="expand-lbl">跳过原因</div><div class="expand-box">${escapeHtml(e.error_message)}</div></div>` : ''}
            ${status === 'failed' && e.error_message ? `<div class="expand-sec"><div class="expand-lbl">错误信息</div><div class="expand-box" style="color:var(--accent-alert);">${escapeHtml(e.error_message)}</div></div>` : ''}
            ${e.raw_output ? `<div class="expand-sec"><div class="expand-lbl">AI 原始输出</div><div class="raw-out">${escapeHtml(e.raw_output.slice(0,600))}</div></div>` : ''}
          </div></div>
        </div>`;
      }).join('');
    }

    function seToggle(id) { document.getElementById(id)?.classList.toggle('open'); }
    function seShowReject(id) { document.getElementById(`rf-${id}`)?.classList.add('show'); }
    function seHideReject(id) { document.getElementById(`rf-${id}`)?.classList.remove('show'); }

    async function seApprove(id, type, btn) {
      btn.disabled = true; btn.textContent = '处理中...';
      try {
        const res = await fetch(`${API_BASE}/api/self-evolve/review/approve`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, type }),
        });
        const data = await res.json();
        if (data.success) { seToast('已批准并写入文件', 'ok'); await loadSEData(); }
        else { seToast(`批准失败：${data.error || '未知错误'}`, 'err'); btn.disabled = false; btn.textContent = '✓ 批准并写入'; }
      } catch { seToast('网络错误', 'err'); btn.disabled = false; btn.textContent = '✓ 批准并写入'; }
    }

    async function seDoReject(id, type, cardId) {
      const reason = document.getElementById(`rf-text-${cardId}`)?.value || '';
      try {
        const res = await fetch(`${API_BASE}/api/self-evolve/review/reject`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, type, reason }),
        });
        const data = await res.json();
        if (data.success) { seToast('已拒绝，不会写入任何文件', 'err'); await loadSEData(); }
        else seToast(`拒绝失败：${data.error || '未知错误'}`, 'err');
      } catch { seToast('网络错误', 'err'); }
    }

    async function seTrigger() {
      const overviewEl = document.querySelector('#se-overview-ws');
      const ws = (seCurrentWs || overviewEl?.value || '').trim();
      if (!ws) {
        const hasOptions = overviewEl && [...overviewEl.options].some(o => o.value);
        seToast(hasOptions ? '请先在上方选择一个工作区再触发进化' : '暂无可触发的工作区，请先在该项目里产生一次会话', 'err');
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/api/self-evolve/trigger`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ workspace: ws }),
        });
        const data = await res.json();
        seToast(data.success ? '已触发手动进化' : `触发失败：${data.error || '未知错误'}`, data.success ? 'ok' : 'err');
      } catch { seToast('网络错误', 'err'); }
    }

    function seToast(msg, type) {
      const wrap = document.getElementById('toast-wrap');
      if (!wrap) return;
      const el = document.createElement('div');
      el.className = `toast-item ${type}`; el.textContent = msg;
      wrap.appendChild(el);
      setTimeout(() => { el.style.transition = 'opacity .35s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 350); }, 3200);
    }
  </script>
</body>
</html>
