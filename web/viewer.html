<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgentMem-Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Orbitron:wght@400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep-space: #0a1014;
      --bg-void: #060a0c;
      --bg-panel: rgba(8, 20, 28, 0.92);
      --accent-primary: #00d4aa;
      --accent-glow: rgba(0, 212, 170, 0.4);
      --accent-dim: rgba(0, 212, 170, 0.15);
      --accent-active: #00ff88;
      --accent-alert: #ff4466;
      --accent-warning: #ffaa33;
      --hud-border: rgba(0, 212, 170, 0.35);
      --hud-border-bright: rgba(0, 212, 170, 0.7);
      --hud-bg: rgba(8, 20, 28, 0.88);
      --hud-glow: rgba(0, 212, 170, 0.12);
      --text-primary: #d0e8e4;
      --text-secondary: rgba(208, 232, 228, 0.6);
      --text-dim: rgba(208, 232, 228, 0.35);
      --text-muted: #4a6670;
      --font-pixel: 'Press Start 2P', cursive;
      --font-heading: 'Orbitron', sans-serif;
      --font-body: 'JetBrains Mono', 'Noto Sans SC', monospace;
      --font-chinese: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      --accent-purple: #a78bfa;
      --accent-blue: #60a5fa;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg-deep-space);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
      position: relative;
    }

    /* ===== HUD Titlebar (only shown inside the embedded Electron window) ===== */
    .hud-titlebar {
      position: sticky;
      top: 0;
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: space-between;
      height: 36px;
      padding: 0 6px 0 14px;
      background: var(--bg-void);
      border-bottom: 1px solid var(--hud-border);
      box-shadow: 0 0 18px var(--hud-glow);
      user-select: none;
      -webkit-app-region: drag;
    }
    body.embed .hud-titlebar { display: flex; }
    body.embed .container { padding-top: 16px; }

    .hud-titlebar__brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-pixel);
      font-size: 9px;
      letter-spacing: 0.12em;
      color: var(--accent-primary);
      text-shadow: 0 0 8px var(--accent-glow);
    }
    .hud-titlebar__brand .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-active);
      box-shadow: 0 0 8px var(--accent-active);
    }

    .hud-titlebar__actions {
      display: flex;
      gap: 2px;
      -webkit-app-region: no-drag;
    }
    .hud-btn {
      width: 38px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid transparent;
      border-radius: 4px;
      font-family: var(--font-body);
      font-size: 13px;
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
    }
    .hud-btn:hover {
      background: var(--accent-dim);
      color: var(--accent-primary);
      border-color: var(--hud-border);
    }
    .hud-btn--close:hover {
      background: var(--accent-alert);
      color: #fff;
      border-color: var(--accent-alert);
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 3px,
        rgba(0, 0, 0, 0.06) 3px, rgba(0, 0, 0, 0.06) 6px
      );
      pointer-events: none;
      z-index: 9999;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 0%, transparent 65%, rgba(0, 0, 0, 0.3) 100%);
      pointer-events: none;
      z-index: 9998;
    }

    body::-webkit-scrollbar { width: 8px; }
    body::-webkit-scrollbar-track { background: rgba(0, 212, 170, 0.05); }
    body::-webkit-scrollbar-thumb { background: rgba(0, 212, 170, 0.25); border-radius: 4px; }
    body::-webkit-scrollbar-thumb:hover { background: rgba(0, 212, 170, 0.4); }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    /* Header */
    header {
      background: var(--hud-bg);
      border: 1px solid var(--hud-border);
      padding: 20px 24px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 0 30px var(--hud-glow), inset 0 0 40px rgba(0, 212, 170, 0.02);
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
      opacity: 0.6;
    }

    header h1 {
      font-family: var(--font-pixel);
      font-size: 11px;
      color: var(--accent-primary);
      letter-spacing: 0.1em;
      text-shadow: 0 0 10px var(--accent-glow);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 .icon {
      width: 28px;
      height: 28px;
      border: 1px solid var(--hud-border-bright);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      background: var(--accent-dim);
    }

    .stats {
      margin-top: 12px;
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .stats span {
      background: var(--accent-dim);
      border: 1px solid rgba(0, 212, 170, 0.2);
      padding: 4px 14px;
      border-radius: 4px;
      font-family: var(--font-body);
      font-size: 11px;
    }

    .source-info {
      margin-top: 10px;
      font-family: var(--font-chinese);
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    .source-info .device-badge {
      font-family: var(--font-body);
      color: var(--accent-primary);
      text-shadow: 0 0 4px var(--hud-glow);
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tab {
      padding: 10px 22px;
      background: var(--hud-bg);
      border: 1px solid var(--hud-border);
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-family: var(--font-heading);
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .tab:hover {
      color: var(--text-secondary);
      border-color: var(--hud-border-bright);
    }

    .tab.active {
      background: var(--accent-dim);
      border-color: var(--hud-border-bright);
      color: var(--accent-primary);
      box-shadow: 0 0 12px var(--hud-glow);
      text-shadow: 0 0 6px var(--accent-glow);
    }

    /* Filter */
    .filter-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-bar select {
      padding: 9px 14px;
      border: 1px solid var(--hud-border);
      border-radius: 6px;
      font-size: 12px;
      font-family: var(--font-chinese);
      background: var(--bg-void);
      color: var(--text-secondary);
      cursor: pointer;
      min-width: 200px;
      outline: none;
      transition: border-color 0.2s;
    }

    .filter-bar select:focus {
      border-color: var(--hud-border-bright);
      box-shadow: 0 0 8px var(--hud-glow);
    }

    .filter-bar select option { background: var(--bg-deep-space); color: var(--text-primary); }

    .refresh-btn {
      padding: 9px 18px;
      background: var(--accent-dim);
      border: 1px solid var(--hud-border-bright);
      color: var(--accent-primary);
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-family: var(--font-body);
      transition: all 0.2s;
    }

    .refresh-btn:hover {
      background: rgba(0, 212, 170, 0.25);
      box-shadow: 0 0 12px var(--hud-glow);
      text-shadow: 0 0 6px var(--accent-glow);
    }

    .refresh-btn.export-btn {
      background: rgba(255, 170, 51, 0.12);
      border-color: rgba(255, 170, 51, 0.5);
      color: var(--accent-warning);
    }

    .refresh-btn.export-btn:hover {
      background: rgba(255, 170, 51, 0.25);
      box-shadow: 0 0 12px rgba(255, 170, 51, 0.35);
      text-shadow: 0 0 6px rgba(255, 170, 51, 0.5);
    }

    #sourceFilter { min-width: 220px; }
    #projectFilter { min-width: 220px; flex: 1; max-width: 360px; }

    .card-tag.tag-ide {
      background: rgba(0, 212, 170, 0.18);
      border-color: rgba(0, 212, 170, 0.4);
      color: var(--accent-primary);
    }

    .card-tag.tag-device {
      background: rgba(170, 130, 255, 0.12);
      border-color: rgba(170, 130, 255, 0.35);
      color: #c8b3ff;
    }

    /* 腾讯实习期记忆(工位 Windows 机器导入)的来源标记 */
    .card-tag.tag-tencent {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(0, 82, 217, 0.16);
      border-color: rgba(0, 122, 255, 0.42);
      color: #6aa9ff;
    }

    .card-tag.tag-tencent svg {
      width: 11px;
      height: 11px;
      display: block;
      flex: none;
    }

    .card.session {
      border-left-color: var(--accent-primary);
    }

    /* Cards */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card {
      background: var(--hud-bg);
      border: 1px solid rgba(0, 212, 170, 0.12);
      border-radius: 8px;
      padding: 16px 20px;
      cursor: pointer;
      transition: all 0.2s;
      border-left: 3px solid transparent;
      position: relative;
    }

    .card:hover {
      transform: translateX(4px);
      border-color: var(--hud-border);
      box-shadow: 0 0 20px var(--hud-glow);
      background: rgba(0, 212, 170, 0.05);
    }

    .card.observation {
      border-left-color: var(--accent-active);
    }

    .card.summary {
      border-left-color: var(--accent-warning);
    }

    .card.highlight {
      animation: highlightPulse 2s ease-in-out;
      border-left-color: var(--accent-primary) !important;
      box-shadow: 0 0 25px var(--accent-glow);
    }

    @keyframes highlightPulse {
      0%, 100% { box-shadow: 0 0 10px var(--hud-glow); }
      50% { box-shadow: 0 0 30px var(--accent-glow); }
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .card-id {
      font-family: var(--font-body);
      font-weight: 600;
      color: var(--accent-primary);
      font-size: 12px;
      text-shadow: 0 0 6px var(--hud-glow);
    }

    .card-date {
      font-size: 11px;
      color: var(--text-muted);
    }

    .card-title {
      font-size: 14px;
      font-family: var(--font-chinese);
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text-primary);
      line-height: 1.5;
    }

    .card-subtitle {
      font-size: 12px;
      font-family: var(--font-chinese);
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .card-meta {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .card-tag {
      font-size: 10px;
      padding: 3px 10px;
      background: var(--accent-dim);
      border: 1px solid rgba(0, 212, 170, 0.15);
      border-radius: 3px;
      color: var(--text-secondary);
      font-family: var(--font-body);
    }

    .card-tag.status-active {
      background: rgba(0, 255, 136, 0.12);
      border-color: rgba(0, 255, 136, 0.3);
      color: var(--accent-active);
    }

    .card-tag.status-completed {
      background: var(--accent-dim);
      border-color: var(--hud-border);
      color: var(--accent-primary);
    }

    .card-tag.status-failed {
      background: rgba(255, 68, 102, 0.12);
      border-color: rgba(255, 68, 102, 0.3);
      color: var(--accent-alert);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(6, 10, 12, 0.85);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--bg-deep-space);
      border: 2px solid var(--hud-border-bright);
      border-radius: 12px;
      max-width: 800px;
      width: 100%;
      max-height: 80vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px var(--accent-glow), inset 0 0 30px rgba(0, 212, 170, 0.02);
    }

    .modal-header {
      padding: 16px 20px;
      background: var(--hud-bg);
      border-bottom: 1px solid var(--hud-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      font-family: var(--font-heading);
      font-size: 13px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent-primary);
      text-shadow: 0 0 8px var(--hud-glow);
    }

    .modal-close {
      background: none;
      border: 1px solid var(--hud-border);
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .modal-close:hover {
      border-color: var(--accent-alert);
      color: var(--accent-alert);
      background: rgba(255, 68, 102, 0.1);
    }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-body::-webkit-scrollbar { width: 6px; }
    .modal-body::-webkit-scrollbar-track { background: rgba(0, 212, 170, 0.05); }
    .modal-body::-webkit-scrollbar-thumb { background: rgba(0, 212, 170, 0.25); border-radius: 3px; }

    .json-view {
      background: var(--bg-void);
      color: var(--accent-primary);
      padding: 20px;
      border-radius: 6px;
      border: 1px solid rgba(0, 212, 170, 0.15);
      font-family: var(--font-body);
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
      overflow-x: auto;
      line-height: 1.7;
    }

    .modal-footer {
      padding: 12px 20px;
      border-top: 1px solid var(--hud-border);
      display: flex;
      justify-content: flex-end;
    }

    .modal-footer button {
      padding: 8px 18px;
      background: var(--accent-dim);
      border: 1px solid var(--hud-border-bright);
      color: var(--accent-primary);
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-family: var(--font-body);
      transition: all 0.2s;
    }

    .modal-footer button:hover {
      background: rgba(0, 212, 170, 0.25);
      box-shadow: 0 0 10px var(--hud-glow);
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 48px;
      color: var(--text-muted);
      font-family: var(--font-chinese);
      font-size: 13px;
    }

    .loading::after {
      content: '';
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(0, 212, 170, 0.2);
      border-top-color: var(--accent-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-left: 10px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 64px 20px;
      color: var(--text-muted);
      font-family: var(--font-chinese);
    }

    .empty-state::before {
      content: '[ ]';
      font-family: var(--font-pixel);
      font-size: 24px;
      display: block;
      margin-bottom: 16px;
      color: var(--text-dim);
    }

    /* Error */
    .error {
      background: rgba(255, 68, 102, 0.08);
      border: 1px solid rgba(255, 68, 102, 0.3);
      color: var(--accent-alert);
      padding: 15px 20px;
      border-radius: 6px;
      margin-bottom: 20px;
      font-family: var(--font-chinese);
      font-size: 13px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .container {
        padding: 12px;
      }

      header {
        padding: 16px;
      }

      header h1 {
        font-size: 9px;
      }

      .stats span {
        display: block;
        margin: 5px 0;
      }

      .tabs {
        gap: 5px;
      }

      .tab {
        padding: 8px 14px;
        font-size: 11px;
      }
    }

    /* ========================= SELF-EVOLVE PLUGIN ========================= */
    .tab.evolve-tab.active {
      background: rgba(167,139,250,0.12);
      border-color: rgba(167,139,250,0.55);
      color: var(--accent-purple);
      box-shadow: 0 0 14px rgba(167,139,250,0.2);
      text-shadow: 0 0 8px rgba(167,139,250,0.5);
    }
    .tab-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--accent-warning); color: #000;
      font-size: 9px; font-weight: 700; margin-left: 5px; vertical-align: middle;
    }
    /* Plugin tab indicator: marks dynamically-registered plugin pages so they
       are visually distinct from the built-in Summaries/Observations/Sessions. */
    .tab.plugin-tab { position: relative; overflow: visible; }
    .tab .plugin-mark {
      position: absolute; top: -7px; right: -7px;
      min-width: 16px; height: 16px; padding: 0 2px; box-sizing: border-box;
      border-radius: 8px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 10px; line-height: 1;
      background: var(--bg-void, #0a1014);
      border: 1px solid rgba(167,139,250,0.6);
      box-shadow: 0 0 6px rgba(167,139,250,0.35);
      pointer-events: none; user-select: none;
    }
    .tab.plugin-tab.active .plugin-mark { border-color: rgba(167,139,250,0.9); box-shadow: 0 0 8px rgba(167,139,250,0.5); }
    .plugin-header {
      background: rgba(167,139,250,0.07); border: 1px solid rgba(167,139,250,0.25);
      border-radius: 10px; padding: 14px 20px; margin-bottom: 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .plugin-header-left { display: flex; align-items: center; gap: 14px; }
    .plugin-icon {
      width: 36px; height: 36px; background: rgba(167,139,250,0.15);
      border: 1px solid rgba(167,139,250,0.4); border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .plugin-name { font-family: var(--font-heading); font-size: 13px; letter-spacing: 0.08em; color: var(--accent-purple); text-shadow: 0 0 8px rgba(167,139,250,0.4); }
    .plugin-desc { font-family: var(--font-chinese); font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .plugin-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .plugin-tag { font-size: 10px; padding: 3px 10px; border-radius: 3px; border: 1px solid; font-family: var(--font-body); }
    .pt-on  { background: rgba(0,255,136,0.08); border-color: rgba(0,255,136,0.25); color: var(--accent-active); }
    .pt-off { background: rgba(255,68,102,0.08); border-color: rgba(255,68,102,0.25); color: var(--accent-alert); }
    .pt-mode { background: rgba(255,170,51,0.08); border-color: rgba(255,170,51,0.25); color: var(--accent-warning); }
    .pt-plat { background: rgba(0,212,170,0.08); border-color: rgba(0,212,170,0.2); color: var(--text-secondary); }
    .sub-tabs {
      display: flex; gap: 0; margin-bottom: 16px;
      border: 1px solid rgba(167,139,250,0.2); border-radius: 8px;
      overflow: hidden; background: var(--bg-void);
    }
    .sub-tab {
      flex: 1; padding: 9px 0; text-align: center;
      font-family: var(--font-heading); font-size: 10px;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--text-muted); cursor: pointer; transition: all 0.18s;
      border-right: 1px solid rgba(167,139,250,0.15);
    }
    .sub-tab:last-child { border-right: none; }
    .sub-tab:hover { color: var(--accent-purple); background: rgba(167,139,250,0.05); }
    .sub-tab.active { background: rgba(167,139,250,0.12); color: var(--accent-purple); text-shadow: 0 0 6px rgba(167,139,250,0.4); }
    .sub-badge {
      display: inline-block; background: var(--accent-warning); color: #000;
      font-size: 9px; font-weight: 700; width: 14px; height: 14px; border-radius: 50%;

    .inv-toggle.on::after { transform: translateX(14px); }
    .inv-info { flex: 1; min-width: 0; cursor: pointer; }
    .inv-title { font-size: 12px; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .inv-meta { display: flex; gap: 5px; margin-top: 2px; flex-wrap: wrap; }
    .inv-tag { font-size: 9px; padding: 1px 5px; border-radius: 3px; font-family: var(--font-body); }
    .inv-tag.it-cat { background: rgba(0,212,170,0.1); color: var(--accent-primary); }
    .inv-tag.it-kind { background: rgba(244,114,182,0.1); color: #f472b6; }
    .inv-tag.it-pending { background: rgba(245,158,11,0.1); color: var(--accent-warning); }
    .inv-tag.it-approved { background: rgba(0,212,170,0.08); color: var(--accent-primary); }
    .inv-tag.it-auto { background: rgba(139,148,158,0.08); color: var(--text-secondary); }
    .inv-score { font-size: 10px; font-family: var(--font-body); font-weight: 600; padding: 2px 5px; border-radius: 3px; flex-shrink: 0; }
    .inv-score.ihi { color: var(--accent-primary); background: rgba(0,212,170,0.08); }
    .inv-score.imid { color: var(--accent-warning); background: rgba(245,158,11,0.08); }
    .inv-score.ilo { color: var(--accent-alert); background: rgba(239,68,68,0.08); }
    .inv-date { font-size: 9px; color: var(--text-muted); font-family: var(--font-body); flex-shrink: 0; }
    .inv-chevron { font-size: 9px; color: var(--text-muted); transition: transform 0.2s; flex-shrink: 0; cursor: pointer; }
    .inv-item.inv-expanded .inv-chevron { transform: rotate(90deg); }
    .inv-detail { display: none; padding: 0 12px 10px; border-top: 1px solid rgba(0,212,170,0.06); }
    .inv-item.inv-expanded .inv-detail { display: block; }
    .inv-item.inv-expanded { border-color: rgba(0,212,170,0.3); }
    .inv-detail-lbl { font-size: 9px; color: var(--text-muted); text-transform: uppercase; font-family: var(--font-body); margin: 8px 0 3px; letter-spacing: 0.05em; }
    .inv-detail-box { font-size: 11px; color: var(--text-secondary); line-height: 1.7; background: rgba(0,0,0,0.25); border-radius: 5px; padding: 7px 10px; white-space: pre-wrap; word-break: break-word; max-height: 150px; overflow-y: auto; }
    .inv-detail-foot { margin-top: 6px; display: flex; gap: 12px; font-size: 9px; color: var(--text-muted); font-family: var(--font-body); }
    .inv-ide-targets { display: flex; align-items: center; gap: 5px; padding: 4px 0 0 44px; flex-wrap: wrap; }
    .inv-ide-label { font-size: 10px; color: var(--text-muted); font-family: var(--font-body); }
    .inv-ide-chip { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 10px; cursor: pointer; transition: all 0.15s; user-select: none; font-family: var(--font-body); }
    .inv-ide-chip.ide-on { background: rgba(0,212,170,0.12); border: 1px solid rgba(0,212,170,0.4); color: var(--accent-primary); }
    .inv-ide-chip.ide-on::before { content: '✓ '; }
    .inv-ide-chip.ide-off { background: rgba(100,100,130,0.08); border: 1px solid rgba(100,100,130,0.2); color: var(--text-muted); }
    .inv-ide-chip:hover { opacity: 0.8; transform: scale(1.04); }
    .toast-wrap { position: fixed; bottom: 22px; right: 22px; display: flex; flex-direction: column; gap: 7px; z-index: 9000; pointer-events: none; }
    .toast-item { padding: 9px 16px; border-radius: 6px; font-family: var(--font-chinese); font-size: 12px; border: 1px solid; backdrop-filter: blur(8px); animation: toastIn 0.25s ease; max-width: 300px; }
    .toast-item.ok  { background: rgba(0,255,136,0.1);  border-color: rgba(0,255,136,0.35);  color: var(--accent-active); }
    .toast-item.err { background: rgba(255,68,102,0.1); border-color: rgba(255,68,102,0.35); color: var(--accent-alert); }
    @keyframes toastIn { from{transform:translateX(14px);opacity:0} to{transform:none;opacity:1} }

  </style>
</head>
<body>
  <header class="hud-titlebar" id="hudTitlebar">
    <div class="hud-titlebar__brand">
      <span class="dot"></span>
      <span>AGENTMEM // VIEWER</span>
    </div>
    <div class="hud-titlebar__actions">
      <button class="hud-btn" id="hudBtnMin" title="最小化" aria-label="Minimize">&#x2014;</button>
      <button class="hud-btn" id="hudBtnMax" title="最大化 / 还原" aria-label="Maximize">&#x25A2;</button>
      <button class="hud-btn hud-btn--close" id="hudBtnClose" title="关闭" aria-label="Close">&#x2715;</button>
    </div>
  </header>

  <div class="container">
    <!-- Header -->
    <header>
      <h1>
        <span class="icon">&#x25C8;</span>
        AgentMem-Viewer
      </h1>
      <div class="stats" id="stats">
        <span>加载中...</span>
      </div>
      <div class="source-info" id="sourceInfo"></div>
    </header>

    <!-- Tabs -->
    <div class="tabs" id="mainTabs">
      <button class="tab active" data-tab="summaries">Summaries</button>
      <button class="tab" data-tab="observations">Observations</button>
      <button class="tab" data-tab="sessions">Sessions</button>
      <!-- Plugin tabs are dynamically injected by loadPluginTabs() -->
    </div>

    <!-- Regular panel (summaries / observations / sessions) -->
    <div id="regular-panel">
      <!-- Filter Bar -->
      <div class="filter-bar">
        <select id="sourceFilter" title="数据源">
          <option value="local">&#x25A2; Local (this device)</option>
          <option value="remote">&#x2601; Remote (all devices)</option>
        </select>
        <select id="projectFilter">
          <option value="">所有项目</option>
        </select>
        <button class="refresh-btn" onclick="refreshData()">&#x21BB; Refresh</button>
        <button class="refresh-btn export-btn" onclick="exportMarkdown()">&#x2193; 导出 MD</button>
      </div>

      <!-- Content -->
      <div id="content" class="card-list">
        <div class="loading">加载数据中</div>
      </div>
    </div>

    <!-- Plugin panels are dynamically created by loadPluginTabs() -->
    <div id="plugin-panels"></div>

  </div><!-- /container -->

  <!-- Toast notifications -->
  <div id="toast-wrap" class="toast-wrap"></div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Detail</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <pre class="json-view" id="modalContent"></pre>
      </div>
      <div class="modal-footer">
        <button onclick="closeModal()">Close</button>
      </div>
    </div>
  </div>

  <script>
    const __viewerUrlParams = new URLSearchParams(window.location.search);
    const __viewerPort = __viewerUrlParams.get('port') || '3847';
    const __viewerEmbed = __viewerUrlParams.get('embed') === '1' || !!window.viewerAPI;
    const API_BASE = `http://127.0.0.1:${__viewerPort}`;
    const SOURCE_KEY = 'agent-memory-viewer-source';

    if (__viewerEmbed) {
      document.body.classList.add('embed');
    }

    if (window.viewerAPI) {
      const $min = document.getElementById('hudBtnMin');
      const $max = document.getElementById('hudBtnMax');
      const $close = document.getElementById('hudBtnClose');
      if ($min) $min.addEventListener('click', () => window.viewerAPI.minimize());
      if ($max) $max.addEventListener('click', () => window.viewerAPI.toggleMaximize());
      if ($close) $close.addEventListener('click', () => window.viewerAPI.close());

      window.viewerAPI.onMaximizeChange((maximized) => {
        if (!$max) return;
        $max.innerHTML = maximized ? '&#x2750;' : '&#x25A2;';
        $max.title = maximized ? '还原' : '最大化';
      });

      window.viewerAPI.onNavigate(({ tab, id }) => {
        if (tab && (['summaries', 'observations', 'sessions'].includes(tab) || loadedPluginIds.includes(tab))) {
          switchTab(tab);
        }
        if (id) {
          setTimeout(() => {
            const el = document.querySelector(`[data-id="${id}"]`);
            if (el) {
              el.scrollIntoView({ behavior: 'smooth', block: 'center' });
              el.classList.add('highlight');
            }
          }, 600);
        }
      });
    }

    let currentTab = 'summaries';
    let currentProject = '';
    let currentSource = localStorage.getItem(SOURCE_KEY) || 'local';
    let observationsData = [];
    let summariesData = [];
    let sessionsData = [];
    let serverConfig = { remoteEnabled: false, remoteUrl: null, deviceId: null };

    const content = document.getElementById('content');
    const stats = document.getElementById('stats');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const modalContent = document.getElementById('modalContent');
    const projectFilter = document.getElementById('projectFilter');
    const sourceFilter = document.getElementById('sourceFilter');
    const sourceInfo = document.getElementById('sourceInfo');

    // Plugin tab registry: maps plugin id → { onActivate fn }
    const PLUGIN_RENDERERS = {};
    let loadedPluginIds = [];

    function switchTab(tabName) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      const targetTab = document.querySelector(`.tab[data-tab="${tabName}"]`);
      if (targetTab) targetTab.classList.add('active');
      currentTab = tabName;
      const regularPanel = document.getElementById('regular-panel');
      regularPanel.style.display = 'none';

      // Hide all plugin panels
      document.querySelectorAll('#plugin-panels > div').forEach(p => p.style.display = 'none');

      // Check if it's a plugin tab
      const pluginPanel = document.getElementById(`${tabName}-panel`);
      if (pluginPanel && PLUGIN_RENDERERS[tabName]) {
        pluginPanel.style.display = 'block';
        if (PLUGIN_RENDERERS[tabName].onActivate) PLUGIN_RENDERERS[tabName].onActivate();
      } else {
        regularPanel.style.display = 'block';
        renderCurrentTab();
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      initTabs();
      sourceFilter.value = currentSource;
      sourceFilter.addEventListener('change', (e) => {
        currentSource = e.target.value;
        localStorage.setItem(SOURCE_KEY, currentSource);
        updateSourceInfo();
        loadProjects();
        loadAllData();
      });

      await loadServerConfig();
      await loadPluginTabs();
      updateSourceInfo();
      loadProjects();
      loadAllData();

      const urlParams = new URLSearchParams(window.location.search);
      const tabParam = urlParams.get('tab');
      const idParam = urlParams.get('id');

      if (tabParam && (['summaries', 'observations', 'sessions'].includes(tabParam) || loadedPluginIds.includes(tabParam))) {
        switchTab(tabParam);
      }

      if (idParam) {
        setTimeout(() => {
          const el = document.querySelector(`[data-id="${idParam}"]`);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            el.classList.add('highlight');
          }
        }, 1000);
      }
    });

    function initTabs() {
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          switchTab(tab.dataset.tab);
        });
      });
    }

    projectFilter.addEventListener('change', (e) => {
      currentProject = e.target.value;
      loadAllData();
    });

    function buildQuery(extra = {}) {
      const params = new URLSearchParams();
      if (currentSource && currentSource !== 'local') params.set('source', currentSource);
      if (currentProject) params.set('project', currentProject);
      for (const [k, v] of Object.entries(extra)) params.set(k, v);
      const qs = params.toString();
      return qs ? `?${qs}` : '';
    }

    async function loadServerConfig() {
      try {
        const res = await fetch(`${API_BASE}/api/viewer/config`);
        const data = await res.json();
        if (data.success) serverConfig = data.data;
      } catch (err) {
        console.warn('Could not load server config:', err);
      }
      const remoteOpt = sourceFilter.querySelector('option[value="remote"]');
      if (!serverConfig.remoteEnabled) {
        remoteOpt.disabled = true;
        remoteOpt.textContent = '\u2601 Remote (not configured)';
        if (currentSource === 'remote') {
          currentSource = 'local';
          sourceFilter.value = 'local';
          localStorage.setItem(SOURCE_KEY, 'local');
        }
      }
    }

    // \u2500\u2500 Plugin dynamic tab loading \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
    async function loadPluginTabs() {
      try {
        const res = await fetch(`${API_BASE}/api/plugins/ui-manifest`);
        const json = await res.json();
        if (!json.success || !Array.isArray(json.data)) return;

        const tabContainer = document.getElementById('mainTabs');
        const panelContainer = document.getElementById('plugin-panels');

        // Also probe ShadwMonitor independently (it's a separate process, not managed by Worker)
        let shadwReachable = false;
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 2000);
          const probe = await fetch('http://localhost:8080/api/status', { signal: controller.signal });
          clearTimeout(timer);
          shadwReachable = probe.ok;
        } catch { /* offline */ }

        // Build the full plugin list: API manifests + locally detected plugins
        const plugins = [...json.data];
        if (shadwReachable && !plugins.find(p => p.id === 'shadwmonitor')) {
          plugins.push({
            id: 'shadwmonitor',
            name: 'ShadwMonitor',
            enabled: true,
            tab: { label: 'ShadwMonitor', icon: '\u25a6', order: 200, badge: 'shadw-badge', cssClass: 'shadw-tab' },
          });
        }

        plugins.sort((a, b) => (a.tab?.order ?? 999) - (b.tab?.order ?? 999));

        for (const plugin of plugins) {
          if (!plugin.tab) continue;

          // Create Tab button (plugin pages get a corner mark to distinguish
          // them from the built-in tabs)
          const btn = document.createElement('button');
          btn.className = `tab plugin-tab ${plugin.tab.cssClass || ''}`;
          btn.dataset.tab = plugin.id;
          btn.title = `${plugin.name || plugin.tab.label} · 插件页面`;
          btn.innerHTML = `<span class="plugin-mark" aria-label="插件" title="插件页面">\u{1F9E9}</span>${plugin.tab.label} ${plugin.tab.badge ? `<span id="${plugin.tab.badge}" class="tab-badge" style="display:none">0</span>` : ''}`;
          btn.addEventListener('click', () => switchTab(plugin.id));
          tabContainer.appendChild(btn);

          // Create Panel container with plugin-specific content
          const renderer = PLUGIN_RENDERERS[plugin.id];
          if (renderer && renderer.createPanel) {
            const panel = document.createElement('div');
            panel.id = `${plugin.id}-panel`;
            panel.style.display = 'none';
            panel.innerHTML = renderer.createPanel();
            panelContainer.appendChild(panel);
          }

          loadedPluginIds.push(plugin.id);
        }
      } catch (err) {
        console.warn('Failed to load plugin tabs:', err);
      }
    }

    function updateSourceInfo() {
      if (currentSource === 'remote' && serverConfig.remoteUrl) {
        sourceInfo.innerHTML = `&#x2601; 聚合视图 · 来源 <span class="device-badge">${escapeHtml(serverConfig.remoteUrl)}</span>`;
      } else {
        const dev = serverConfig.deviceId ? ` <span class="device-badge">${escapeHtml(serverConfig.deviceId.slice(0, 8))}</span>` : '';
        sourceInfo.innerHTML = `&#x25A2; 本机数据${dev}`;
      }
    }

    async function loadProjects() {
      try {
        const res = await fetch(`${API_BASE}/api/viewer/projects${buildQuery()}`);
        const data = await res.json();
        if (data.success) {
          const prevValue = projectFilter.value;
          projectFilter.innerHTML = '<option value="">所有项目</option>';
          data.data.forEach(project => {
            const option = document.createElement('option');
            option.value = project;
            const short = project.split(/[/\\]/).pop() || project;
            option.textContent = short;
            projectFilter.appendChild(option);
          });
          if ([...projectFilter.options].some(o => o.value === prevValue)) {
            projectFilter.value = prevValue;
          }
        }
      } catch (err) {
        console.error('Failed to load projects:', err);
      }
    }

    async function loadAllData() {
      content.innerHTML = '<div class="loading">加载数据中</div>';

      try {
        const [observationsRes, summariesRes, sessionsRes] = await Promise.all([
          fetch(`${API_BASE}/api/viewer/observations${buildQuery({ limit: '500' })}`),
          fetch(`${API_BASE}/api/viewer/summaries${buildQuery({ limit: '500' })}`),
          fetch(`${API_BASE}/api/viewer/sessions${buildQuery({ limit: '500' })}`)
        ]);

        const [observationsJson, summariesJson, sessionsJson] = await Promise.all([
          observationsRes.json(),
          summariesRes.json(),
          sessionsRes.json()
        ]);

        observationsData = observationsJson.success ? observationsJson.data : [];
        summariesData = summariesJson.success ? summariesJson.data : [];
        sessionsData = sessionsJson.success ? sessionsJson.data : [];

        updateStats();
        renderCurrentTab();
      } catch (err) {
        console.error('Failed to load data:', err);
        const hint = currentSource === 'remote'
          ? '无法连接远程服务，请检查 CODEBUDDY_MEM_REMOTE_URL / TOKEN'
          : `请确认 worker 服务运行在 ${API_BASE}`;
        content.innerHTML = `<div class="error">数据加载失败 · ${hint}</div>`;
      }
    }

    function refreshData() {
      loadServerConfig().then(() => {
        updateSourceInfo();
        loadProjects();
        loadAllData();
      });
    }

    function exportMarkdown() {
      const project = projectFilter.value;
      const params = new URLSearchParams();
      const today = new Date().toISOString().slice(0, 10);
      params.set('date', today);
      if (project) params.set('project', project);
      const url = `${API_BASE}/api/export/markdown?${params}`;
      const a = document.createElement('a');
      a.href = url;
      a.download = `memory-${today}.md`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function updateStats() {
      const devCount = currentSource === 'remote'
        ? new Set([...observationsData, ...summariesData, ...sessionsData].map(x => x.device_name || x.device_id).filter(Boolean)).size
        : 1;
      stats.innerHTML = `
        <span>&#x25A0; ${summariesData.length} Summaries</span>
        <span>&#x25C6; ${observationsData.length} Observations</span>
        <span>&#x29BE; ${sessionsData.length} Sessions</span>
        <span>&#x25EF; ${devCount} Device${devCount === 1 ? '' : 's'}</span>
      `;
    }

    function renderCurrentTab() {
      switch (currentTab) {
        case 'summaries':
          renderSummaries();
          break;
        case 'observations':
          renderObservations();
          break;
        case 'sessions':
          renderSessions();
          break;
      }
    }

    function deviceLabel(row) {
      if (currentSource !== 'remote') return '';
      const name = row.device_name || (row.device_id ? row.device_id.slice(0, 8) : '');
      return name ? `<span class="card-tag tag-device">&#x1F5A5; ${escapeHtml(name)}</span>` : '';
    }

    // 用户可见的 IDE 标签别名:adapter 内部 id 与展示名解耦,
    // 这样数据库里 source_ide 仍按 adapter id 存储(便于产品多 IDE 区分),
    // 但用户在 UI 上看到的标签是产品名(去掉 -ide 等后缀)。
    const IDE_DISPLAY_ALIAS = {
      'codebuddy-ide': 'codebuddy',
      'imported:codebuddy-ide': 'imported:codebuddy',
      'codex-cli': 'codex',
      'imported:codex-cli': 'imported:codex',
    };

    function ideLabel(row) {
      if (!row.source_ide) return '';
      const display = IDE_DISPLAY_ALIAS[row.source_ide] || row.source_ide;
      return `<span class="card-tag tag-ide">${escapeHtml(display)}</span>`;
    }

    // 腾讯实习记忆是从工位 Windows 机器导入的,本机记忆一律是 mac 路径,
    // 所以用 project 路径形态判定来源:盘符(C:\...)或 UNC(\\host\...)即腾讯。
    function isTencentRow(row) {
      const p = row && row.project;
      if (!p) return false;
      return /^[A-Za-z]:[\\/]/.test(p) || p.startsWith('\\\\');
    }

    const TENCENT_LOGO_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">'
      + '<path fill="currentColor" d="M12 2.6c-4.2 0-7.2 2.4-7.2 2.4l1.5 2.3S8.7 5.6 12 5.6s5.7 1.7 5.7 1.7l1.5-2.3S16.2 2.6 12 2.6z"/>'
      + '<path fill="currentColor" d="M12 8.1c-3 0-5.3 2-5.3 2l1.5 2.3S9.8 11 12 11s3.8 1.4 3.8 1.4l1.5-2.3s-2.3-2-5.3-2z"/>'
      + '<path fill="currentColor" d="M12 13.6c-1.9 0-3.4 1.3-3.4 1.3l1.5 2.3s.8-.7 1.9-.7 1.9.7 1.9.7l1.5-2.3s-1.5-1.3-3.4-1.3z"/>'
      + '</svg>';

    function tencentLabel(row) {
      if (!isTencentRow(row)) return '';
      return `<span class="card-tag tag-tencent" title="腾讯实习期记忆">${TENCENT_LOGO_SVG}Tencent</span>`;
    }

    function safeText(value, fallback = '') {
      if (value === null || value === undefined) return fallback;
      const s = String(value).trim();
      return s.length ? s : fallback;
    }

    const _obsCache = new Map();
    const _sumCache = new Map();
    const _sesCache = new Map();

    function renderObservations() {
      if (observationsData.length === 0) {
        content.innerHTML = '<div class="empty-state">暂无观察记录</div>';
        return;
      }

      _obsCache.clear();
      content.innerHTML = observationsData.map(obs => {
        _obsCache.set(obs.id, obs);
        const project = obs.project ? (obs.project.split(/[/\\]/).pop() || obs.project) : '';
        return `
        <div class="card observation" data-id="${obs.id}" onclick="showObsDetail(${obs.id})">
          <div class="card-header">
            <span class="card-id">#${obs.id}</span>
            <span class="card-date">${formatDate(obs.created_at)}</span>
          </div>
          <div class="card-title">${escapeHtml(safeText(obs.title, obs.type || '(no title)'))}</div>
          <div class="card-subtitle">${escapeHtml(truncate(safeText(obs.narrative || obs.text, ''), 150))}</div>
          <div class="card-meta">
            ${obs.type ? `<span class="card-tag">${escapeHtml(obs.type)}</span>` : ''}
            ${project ? `<span class="card-tag">${escapeHtml(project)}</span>` : ''}
            ${ideLabel(obs)}
            ${deviceLabel(obs)}
            ${tencentLabel(obs)}
          </div>
        </div>`;
      }).join('');
    }

    function showObsDetail(id) {
      const obs = _obsCache.get(id);
      if (obs) showDetail('Observation #' + id, obs);
    }

    function renderSummaries() {
      if (summariesData.length === 0) {
        content.innerHTML = '<div class="empty-state">暂无总结记录</div>';
        return;
      }

      _sumCache.clear();
      content.innerHTML = summariesData.map(summary => {
        _sumCache.set(summary.id, summary);
        const project = summary.project ? (summary.project.split(/[/\\]/).pop() || summary.project) : '';
        return `
        <div class="card summary" data-id="${summary.id}" onclick="showSumDetail(${summary.id})">
          <div class="card-header">
            <span class="card-id">#${summary.display_rank ?? summary.id}</span>
            <span class="card-date">${formatDate(summary.created_at)}</span>
          </div>
          <div class="card-title">${escapeHtml(truncate(safeText(summary.request, '(无标题)'), 80))}</div>
          <div class="card-subtitle">${escapeHtml(truncate(safeText(summary.completed || summary.learned, ''), 150))}</div>
          <div class="card-meta">
            ${project ? `<span class="card-tag">${escapeHtml(project)}</span>` : ''}
            ${ideLabel(summary)}
            ${deviceLabel(summary)}
            ${tencentLabel(summary)}
          </div>
        </div>`;
      }).join('');
    }

    function showSumDetail(id) {
      const summary = _sumCache.get(id);
      if (summary) showDetail('Summary #' + id, summary);
    }

    function renderSessions() {
      if (sessionsData.length === 0) {
        content.innerHTML = '<div class="empty-state">暂无会话记录</div>';
        return;
      }

      _sesCache.clear();
      content.innerHTML = sessionsData.map(session => {
        _sesCache.set(session.id, session);
        const project = session.project ? (session.project.split(/[/\\]/).pop() || session.project) : '';
        const status = session.status || 'unknown';
        const statusCls = status === 'active' ? 'status-active'
                        : status === 'completed' ? 'status-completed'
                        : status === 'failed' ? 'status-failed' : '';
        return `
        <div class="card session" data-id="${session.id}" onclick="showSesDetail(${session.id})">
          <div class="card-header">
            <span class="card-id">#${session.id}</span>
            <span class="card-date">${formatDate(session.created_at)}</span>
          </div>
          <div class="card-title">${escapeHtml(truncate(safeText(session.user_prompt || session.session_id, '(no prompt)'), 100))}</div>
          <div class="card-subtitle">${escapeHtml(truncate(safeText(session.last_assistant_message, ''), 150))}</div>
          <div class="card-meta">
            <span class="card-tag ${statusCls}">${escapeHtml(status)}</span>
            ${project ? `<span class="card-tag">${escapeHtml(project)}</span>` : ''}
            ${ideLabel(session)}
            ${deviceLabel(session)}
            ${tencentLabel(session)}
          </div>
        </div>`;
      }).join('');
    }

    function showSesDetail(id) {
      const session = _sesCache.get(id);
      if (session) showDetail('Session #' + id, session);
    }

    function showDetail(title, data) {
      modalTitle.textContent = title;
      modalContent.textContent = JSON.stringify(data, null, 2);
      modal.classList.add('active');
    }

    function closeModal() {
      modal.classList.remove('active');
    }

    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        closeModal();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        closeModal();
      }
    });

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr);
      return date.toLocaleString('zh-CN');
    }

    function truncate(str, maxLen) {
      if (!str) return '';
      return str.length > maxLen ? str.substring(0, maxLen) + '...' : str;
    }

    function escapeHtml(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    async function loadInjectorData() {
      if (!injState._wsInit) { injState._wsInit = true; injLoadWorkspaces(); }
      try {
        const [detRes, catRes] = await Promise.all([
          fetch(`${API_BASE}/api/injector/detect`).then(r => r.json()).catch(() => null),
          fetch(`${API_BASE}/api/injector/catalog${injState.workspace ? '?workspace=' + encodeURIComponent(injState.workspace) : ''}`).then(r => r.json()).catch(() => null),
        ]);
        injState.ides = (detRes && detRes.data) || [];
        injState.catalog = (catRes && catRes.data) || [];
        // pre-select detected IDEs on first load
        if (!injState._idesInit) {
          injState.selectedIdes = new Set(injState.ides.filter(i => i.detected).map(i => i.id));
          if (injState.selectedIdes.size === 0 && injState.ides[0]) injState.selectedIdes.add(injState.ides[0].id);
          injState._idesInit = true;
        }
        injRenderChips();
        injRenderTree();
        injRenderList();
      } catch (e) { console.warn('injector load failed', e); }
    }

    function injSetWs(v) { injState.workspace = v.trim(); loadInjectorData(); }

    // Populate the "已记录工作区" dropdown + datalist from the memory system's
    // known projects (normalized absolute paths) plus any previously-injected
    // workspaces from the ledger. Users can still type a path freely.
    async function injLoadWorkspaces() {
      try {
        const [projRes, ledRes] = await Promise.all([
          fetch(`${API_BASE}/api/viewer/projects`).then(r => r.json()).catch(() => null),
          fetch(`${API_BASE}/api/injector/ledger`).then(r => r.json()).catch(() => null),
        ]);
        const projects = (projRes && projRes.success && Array.isArray(projRes.data)) ? projRes.data : [];
        const ledgerWs = (ledRes && Array.isArray(ledRes.data)) ? ledRes.data.map(r => r.workspace) : [];
        const all = [...new Set([...ledgerWs, ...projects].filter(p => p && p.trim()))].sort();
        injState.knownWorkspaces = all;
        const sel = document.getElementById('inj-ws-pick');
        const dl = document.getElementById('inj-ws-options');
        if (sel) sel.innerHTML = '<option value="">↧ 选择已记录工作区</option>' +
          all.map(p => `<option value="${p.replace(/"/g, '&quot;')}">${p}</option>`).join('');
        if (dl) dl.innerHTML = all.map(p => `<option value="${p.replace(/"/g, '&quot;')}"></option>`).join('');
      } catch (e) { console.warn('injector workspaces load failed', e); }
    }

    function injPickWs(v) {
      if (!v) return;
      const input = document.getElementById('inj-ws');
      if (input) input.value = v;

      const sel = document.getElementById('inj-ws-pick');
      if (sel) sel.value = '';
      loadInjectorData();
    }

    function injRenderChips() {
      const el = document.getElementById('inj-chips'); if (!el) return;
      injState.selectedIdes = injState.selectedIdes || new Set();
      el.innerHTML = injState.ides.map(i =>
        `<span class="inj-chip ${injState.selectedIdes.has(i.id) ? 'on' : ''}" onclick="injToggleIde('${i.id}')">${i.displayName}${i.detected ? '<span class="dot"> ·已装</span>' : ''}</span>`
      ).join('');
    }
    function injToggleIde(id) {
      injState.selectedIdes = injState.selectedIdes || new Set();
      if (injState.selectedIdes.has(id)) injState.selectedIdes.delete(id); else injState.selectedIdes.add(id);
      injRenderChips();
    }

    const INJ_CATS = [['all','🗂 全部'],['bundle','📦 整套 Bundle'],['skill','🧩 Skills'],['rule','📐 Rules'],['mcp','🔌 MCP'],['spec','📄 规范文件']];
    function injRenderTree() {
      const el = document.getElementById('inj-tree'); if (!el) return;
      const count = c => c === 'all' ? injState.catalog.filter(i => !injHidden(i)).length : injState.catalog.filter(i => i.category === c && !injHidden(i)).length;
      el.innerHTML = INJ_CATS.map(([c,label]) =>
        `<div class="inj-cat ${injState.cat === c ? 'on' : ''}" onclick="injSetCat('${c}')">${label}<span class="cnt">${count(c)}</span></div>`
      ).join('');
    }
    function injSetCat(c) { injState.cat = c; injRenderTree(); injRenderList(); }

    // members of an atomic bundle are hidden from flat lists
    function injHidden(item) {
      if (item.category === 'bundle') return false;
      if (!item.partOf) return false;
      const b = injState.catalog.find(x => x.id === item.partOf);
      return !!(b && b.atomic);
    }

    function injBadge(item) {
      if (item.status === 'installed') return '<span class="badge installed">已注入 v' + item.installedVersion + '</span>';
      if (item.status === 'update') return '<span class="badge update">可更新 v' + item.installedVersion + '→v' + item.version + '</span>';
      return '<span class="badge none">未注入</span>';
    }
    const INJ_ICON = { skill:'🧩', rule:'📐', mcp:'🔌', spec:'📄' };

    function injRenderList() {
      const el = document.getElementById('inj-list'); if (!el) return;
      const items = injState.catalog.filter(i => !injHidden(i) && (injState.cat === 'all' || i.category === injState.cat));
      if (!items.length) { el.innerHTML = '<div style="color:#6a6a8a;font-size:12px;padding:20px;text-align:center">该分类暂无内容</div>'; injUpdateSel(); return; }
      el.innerHTML = items.map(item => {
        const sel = injState.selected.has(item.id);
        if (item.category === 'bundle') {
          const memberHtml = (item.members || []).map(m => '<span class="mchip">' + m.replace(/^(skill|rule|mcp|spec)\./,'') + '</span>').join('');
          return `<div class="inj-row bundle">
            <div class="cbox ${sel?'on':''}" onclick="injToggle('${item.id}')">${sel?'✓':''}</div>
            <div class="inj-body"><div class="inj-name">📦 ${item.name} ${item.official?'<span class="tag official">官方</span>':''} ${item.atomic?'<span class="tag atomic">原子·不可拆</span>':''}</div>
            <div class="inj-desc">${item.description||''}</div></div>
            <div class="inj-ver">v${item.version}</div>${injBadge(item)}
          </div><div class="members">含 ${(item.members||[]).length} 项：${memberHtml}</div>`;
        }
        const isSys = item.standalone === false;
        return `<div class="inj-row">
          <div class="cbox ${sel?'on':''} ${isSys?'sys':''}" onclick="${isSys?`injTrySys('${item.id}')`:`injToggle('${item.id}')`}">${sel?'✓':''}</div>
          <div style="font-size:16px;width:22px;text-align:center">${INJ_ICON[item.category]||'•'}</div>
          <div class="inj-body"><div class="inj-name">${item.name} ${isSys?`<span class="tag sys">体系组件${item.partOf?'·属于'+item.partOf.replace(/^bundle\./,''):''}</span>`:''}</div>
          <div class="inj-desc">${item.description||''}</div></div>
          <div class="inj-ver">v${item.version}</div>${injBadge(item)}
        </div>`;
      }).join('');
      injUpdateSel();
    }

    function injToggle(id) {
      if (injState.selected.has(id)) injState.selected.delete(id); else injState.selected.add(id);
      injRenderList();
    }
    function injTrySys(id) {
      if (injState.selected.has(id)) { injState.selected.delete(id); injRenderList(); return; }
      const item = injState.catalog.find(i => i.id === id);
      const deps = (item && item.requires) || [];
      const depNames = deps.map(d => d.replace(/^(skill|rule|mcp|spec)\./,'')).join('、');
      if (deps.length === 0 || confirm(`「${item.name}」是体系组件，需配套依赖才能用。\n将一并选中依赖：${depNames}\n\n确定？`)) {
        injState.selected.add(id);
        deps.forEach(d => injState.selected.add(d));
        injRenderList();
      }
    }
    function injUpdateSel() {
      const el = document.getElementById('inj-sel'); if (!el) return;
      const n = injState.selected.size, ides = (injState.selectedIdes && injState.selectedIdes.size) || 0;
      el.textContent = n ? `已选 ${n} 项 → 写入 ${ides} 个 IDE` : '未选择';
    }

    function injItemsForApi() {
      // bundles need workspace too; send selected ids as-is (backend expands)
      return [...injState.selected];
    }
    function injIdesForApi() { return [...(injState.selectedIdes || [])]; }

    async function injPreview() {
      if (!injCheck()) return;
      const planEl = document.getElementById('inj-plan');
      planEl.classList.add('show'); planEl.innerHTML = '解析中…';
      try {
        const res = await fetch(`${API_BASE}/api/injector/preview`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ items: injItemsForApi(), ides: injIdesForApi(), workspace: injState.workspace })
        });
        const j = await res.json();
        if (!j.success) { planEl.innerHTML = '预览失败：' + (j.error||''); return; }
        injRenderPlan(planEl, j.data, false);
      } catch (e) { planEl.innerHTML = '预览失败：' + e; }
    }

    async function injInject() {
      if (!injCheck()) return;
      if (!confirm('确认注入所选内容到 ' + injState.workspace + ' ？')) return;
      const planEl = document.getElementById('inj-plan');
      planEl.classList.add('show'); planEl.innerHTML = '注入中…';
      try {
        const res = await fetch(`${API_BASE}/api/injector/inject`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ items: injItemsForApi(), ides: injIdesForApi(), workspace: injState.workspace })
        });
        const j = await res.json();
        if (!j.success) { planEl.innerHTML = '注入失败：' + (j.error||''); return; }
        injRenderPlan(planEl, j.data, true);
        loadInjectorData();
      } catch (e) { planEl.innerHTML = '注入失败：' + e; }
    }

    function injCheck() {
      if (!injState.workspace) { alert('请先填写目标工作区路径'); return false; }
      if (injState.selected.size === 0) { alert('请先勾选要注入的内容'); return false; }
      if (!(injState.selectedIdes && injState.selectedIdes.size)) { alert('请至少选择一个目标 IDE'); return false; }
      return true;
    }

    function injRenderPlan(el, data, applied) {
      const direct = data.plan.filter(p => !p.viaDependency);
      const dep = data.plan.filter(p => p.viaDependency);
      const row = p => `<div class="prow ${p.viaDependency?'dep':''}"><span class="op ${p.op}">${p.op.toUpperCase()}</span><span class="ppath">${p.targetPath}</span><span class="pide">${p.ide==='*'?'项目根':p.ide}</span></div>`;
      let html = `<div style="font-size:13px;font-weight:600;margin-bottom:6px">${applied ? '✅ 注入完成：写入 '+data.written+' · 跳过 '+data.skipped : '注入预览（dry-run）· 共 '+data.plan.length+' 个写入计划'}</div>`;
      if (direct.length) html += '<div class="pg">直接勾选</div>' + direct.map(row).join('');
      if (dep.length) html += '<div class="pg dep">因依赖自动加入</div>' + dep.map(row).join('');
      el.innerHTML = html;
    }

    function injToggleLedger() {
      const el = document.getElementById('inj-ledger');
      if (el.classList.contains('show')) { el.classList.remove('show'); return; }
      el.classList.add('show'); el.innerHTML = '加载已注入清单…';
      fetch(`${API_BASE}/api/injector/ledger${injState.workspace ? '?workspace=' + encodeURIComponent(injState.workspace) : ''}`)
        .then(r => r.json()).then(j => {
          const rows = (j.data) || [];
          if (!rows.length) { el.innerHTML = '<div style="font-size:12px;color:#6a6a8a">暂无已注入记录</div>'; return; }
          el.innerHTML = '<div style="font-size:13px;font-weight:600;margin-bottom:8px">已注入清单（账本）</div>' + rows.map(r =>
            `<div class="led-row"><span class="op merge" style="width:auto;padding:2px 8px">${r.mode}</span>
             <div style="flex:1;min-width:0"><div style="font-weight:600">${r.injectable_id} <span style="color:#6a6a8a">· ${r.ide} · v${r.version}</span></div>
             <div style="font-size:11px;color:#7a7a96;font-family:var(--mono,monospace);word-break:break-all">${r.target_path}</div></div>
             <button class="mini" onclick="injUninstall(${r.id})">卸载</button></div>`
          ).join('');

    async function injUninstall(id) {
      if (!confirm('卸载该项？将按账本备份还原（受管块删块 / JSON 删键 / 文件还原）。')) return;
      try {
        const res = await fetch(`${API_BASE}/api/injector/uninstall`, {
          method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ ledgerId: id })
        });

        if (!j.success) { alert('卸载失败：' + (j.error||'')); return; }

    PLUGIN_RENDERERS['injector'] = {
      createPanel: createInjectorPanelHTML,
      onActivate: function() { loadInjectorData(); }
    };

    // ========================= SELF-EVOLVE ========================= //
    let seCurrentTab = 'overview';
    let seCurrentWs = '';

    let seSkills = [];
    let seEvoLog = [];
    let seStatus = null;

    function switchSETab(name) {
      seCurrentTab = name;
      document.querySelectorAll('.sub-tab').forEach(t => t.classList.toggle('active', t.dataset.sp === name));
      document.querySelectorAll('.sub-panel').forEach(p => p.classList.toggle('active', p.id === `sp-${name}`));
